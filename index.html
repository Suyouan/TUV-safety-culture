<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>容器與安全標誌管理系統</title>
    <!-- 引入 QR Code 生成套件 qrcodejs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- 頂部導覽列 -->
    <header class="app-header">
        <div class="header-left">
            <button id="backBtn" class="nav-btn" style="display: none;" onclick="goBack()">返回上一步</button>
            <button class="nav-btn" onclick="refreshApp()">重新整理</button>
        </div>
        <h1 class="app-title">
            安全標誌管理系統 
            <span id="pendingBadge" class="badge" style="display: none;">0</span>
        </h1>
        <div class="header-right">
            <button class="nav-btn admin-btn" onclick="openAdminModal()">管理者控制中心</button>
        </div>
    </header>

    <!-- 主容器 -->
    <main id="appMain" class="container">
        <!-- 內容將由 JavaScript 動態渲染，避免載入空白或閃頻 -->
    </main>

    <!-- 管理者登入 / 控制中心 Modal -->
    <div id="adminModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeAdminModal()">&times;</span>
            <div id="adminAuthSection">
                <h2>管理者登入</h2>
                <input type="password" id="adminPwdInput" placeholder="請輸入管理員密碼">
                <button onclick="loginAdmin()">登入</button>
            </div>
            <div id="adminDashboardSection" style="display: none;">
                <h2>管理者控制面板</h2>
                <div class="admin-actions-bar">
                    <button onclick="openAddSignModal()">新增號誌</button>
                    <button onclick="openChangePwdModal()">更改密碼</button>
                    <button onclick="openApprovalListModal()">查看待審批清單</button>
                </div>
                <div id="approvalContainerSection"></div>
            </div>
        </div>
    </div>

    <!-- 新增號誌 Modal -->
    <div id="addSignModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeAddSignModal()">&times;</span>
            <h2>新增容器與標誌</h2>
            <form id="addSignForm" onsubmit="submitNewSign(event)">
                <label>分類代號 (categoryId):</label>
                <input type="text" id="newCategoryId" required placeholder="例如 cat_01">
                <label>容器名稱 (containerName):</label>
                <input type="text" id="newContainerName" required>
                <label>標誌說明 (signDescription):</label>
                <textarea id="newSignDesc" required></textarea>
                <label>圖示網址 (iconUrl):</label>
                <input type="text" id="newIconUrl" required placeholder="https://lh3.googleusercontent.com/d/...">
                <label>是否為警告標誌 (isWarningSign):</label>
                <select id="newIsWarning">
                    <option value="FALSE">否 (FALSE)</option>
                    <option value="TRUE">是 (TRUE - 包含五大危害控制)</option>
                </select>
                <button type="submit">確認新增</button>
            </form>
        </div>
    </div>

    <!-- 更改密碼 Modal -->
    <div id="changePwdModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close" onclick="closeChangePwdModal()">&times;</span>
            <h2>更改管理者密碼</h2>
            <input type="password" id="oldPwdInput" placeholder="請輸入舊密碼">
            <input type="password" id="newPwdInput" placeholder="請輸入新密碼">
            <button onclick="submitChangePassword()">送出變更</button>
        </div>
    </div>

    <!-- 審批清單彈窗 Modal -->
    <div id="approvalListModal" class="modal" style="display: none;">
        <div class="modal-content large-modal">
            <span class="close" onclick="closeApprovalListModal()">&times;</span>
            <h2>待審批清單</h2>
            <div id="approvalListContainer"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
