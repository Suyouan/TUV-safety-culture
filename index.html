<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">職安風險評估與控制平台 (多危害版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 id="main-title" class="text-xl font-bold">職安風險評估平台</h1>
      <button onclick="toggleAdminMode()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded text-sm transition">管理員模式</button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
    <div class="flex border-b border-gray-200">
      <button onclick="switchTab('create')" id="tab-create" class="py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none">新增風險評估提案</button>
      <button onclick="switchTab('search')" id="tab-search" class="py-2 px-4 font-medium text-gray-500 hover:text-gray-700 focus:outline-none">檢索與查詢</button>
    </div>

    <!-- 新增表單 -->
    <section id="section-create" class="bg-white p-6 rounded-lg shadow-sm space-y-4">
      <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">建立包含多個危害的評估提案</h2>
      
      <form id="assessment-form" onsubmit="submitAssessment(event)" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">專屬評估名稱</label>
            <input type="text" id="assessment_name" required placeholder="例如：A廠區高壓電測試作業" class="mt-1 w-full p-2 border rounded">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">建立者姓名</label>
            <input type="text" id="creator" required placeholder="您的姓名" class="mt-1 w-full p-2 border rounded">
          </div>
        </div>

        <!-- 動態危害項目容器 -->
        <div id="hazards-container" class="space-y-4">
          <!-- 預設第一項危害 -->
        </div>

        <button type="button" onclick="addHazardCard()" class="w-full border-2 border-dashed border-blue-300 text-blue-600 hover:bg-blue-50 py-2 rounded font-medium transition">
          ＋ 點此新增另一個危害項目
        </button>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded transition shadow">
          提交完整提案 (送出審批)
        </button>
      </form>
    </section>

    <!-- 檢索與查詢 -->
    <section id="section-search" class="bg-white p-6 rounded-lg shadow-sm space-y-4 hidden">
      <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">跨欄位模糊搜尋</h2>
      <div class="flex gap-2">
        <input type="text" id="search-keyword" placeholder="輸入評估名稱或危害關鍵字..." class="flex-grow p-2 border rounded">
        <button onclick="performSearch()" class="bg-gray-800 text-white px-4 py-2 rounded">搜尋</button>
      </div>
      <div id="search-results" class="space-y-3 pt-2"></div>
    </section>
  </main>

  <!-- 管理員審批彈窗 -->
  <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-lg max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-red-600">管理員審批專區</h3>
        <button onclick="closeAdminModal()" class="text-gray-500 font-bold">✕ 關閉</button>
      </div>
      <div id="pending-container" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/YOUR_GAS_DEPLOYMENT_ID/exec";
    const ADMIN_PASSWORD_HASH = "admin123";
    let globalSettings = {};

    window.onload = function() {
      fetchSettings();
      checkPendingCount();
      addHazardCard(); // 預設展開第一張危害卡片

      const urlParams = new URLSearchParams(window.location.search);
      const assessmentId = urlParams.get('assessment_id');
      if (assessmentId) loadAssessmentDetail(assessmentId);
    };

    function switchTab(tabName) {
      if (tabName === 'create') {
        document.getElementById('section-create').classList.remove('hidden');
        document.getElementById('section-search').classList.add('hidden');
        document.getElementById('tab-create').className = "py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none";
        document.getElementById('tab-search').className = "py-2 px-4 font-medium text-gray-500 hover:text-gray-700 focus:outline-none";
      } else {
        document.getElementById('section-create').classList.add('hidden');
        document.getElementById('section-search').classList.remove('hidden');
        document.getElementById('tab-create').className = "py-2 px-4 font-medium text-gray-500 hover:text-gray-700 focus:outline-none";
        document.getElementById('tab-search').className = "py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none";
        performSearch();
      }
    }

    async function fetchSettings() {
      try {
        let res = await fetch(`${GAS_API_URL}?action=getSettings`);
        let json = await res.json();
        if (json.status === "success") {
          globalSettings = json.data;
          window.hazardOptionsHtml = json.data.hazards.map(h => `<option value="${h}">`).join('');
          window.controlOptionsHtml = {
            elimination: json.data.controls.elimination.map(i => `<option value="${i}">`).join(''),
            substitution: json.data.controls.substitution.map(i => `<option value="${i}">`).join(''),
            engineering: json.data.controls.engineering.map(i => `<option value="${i}">`).join(''),
            administrative: json.data.controls.administrative.map(i => `<option value="${i}">`).join(''),
            ppe: json.data.controls.ppe.map(i => `<option value="${i}">`).join('')
          };
          // 更新現有卡片的 datalist
          document.querySelectorAll('datalist').forEach(dl => {
            let type = dl.dataset.type;
            if (type && window.controlOptionsHtml[type]) dl.innerHTML = window.controlOptionsHtml[type];
            if (type === 'hazard') dl.innerHTML = window.hazardOptionsHtml;
          });
        }
      } catch (err) { console.error(err); }
    }

    // 【修正後】動態新增危害卡片（包含完整的 datalist 選項綁定）
function addHazardCard() {
  let container = document.getElementById('hazards-container');
  let cardId = 'hazard-card-' + Date.now();
  
  // 組裝現有的選項內容
  let hazardOpts = window.hazardOptionsHtml || '';
  let elimOpts = window.controlOptionsHtml?.elimination || '';
  let subOpts = window.controlOptionsHtml?.substitution || '';
  let engOpts = window.controlOptionsHtml?.engineering || '';
  let adminOpts = window.controlOptionsHtml?.administrative || '';
  let ppeOpts = window.controlOptionsHtml?.ppe || '';

  let cardHtml = `
    <div id="${cardId}" class="border border-blue-200 bg-blue-50/30 p-4 rounded-lg space-y-3 relative">
      <button type="button" onclick="this.parentElement.remove()" class="absolute top-3 right-3 text-red-500 hover:text-red-700 text-sm font-bold">移除此危害 ✕</button>
      <h3 class="font-bold text-blue-900 text-sm">危害項目</h3>
      <div>
        <label class="block text-xs font-semibold text-gray-600">危害種類 (可選取現有或直接輸入新種類)</label>
        <input type="text" name="hazard_type" list="list-${cardId}-hazard" required placeholder="選擇或輸入危害種類..." class="mt-1 w-full p-2 border rounded bg-white text-sm">
        <datalist id="list-${cardId}-hazard">${hazardOpts}</datalist>
      </div>
      <div>
        <label class="block text-xs font-semibold text-gray-600">危害情境詳細描述</label>
        <textarea name="hazard_desc" rows="2" required placeholder="描述具體情境..." class="mt-1 w-full p-2 border rounded bg-white text-sm"></textarea>
      </div>
      <div class="grid grid-cols-3 gap-2 items-center bg-white p-3 rounded border">
        <div>
          <label class="block text-xs font-medium">嚴重性 (1~4)</label>
          <select name="severity" onchange="calculateCardRisk(this)" class="w-full p-1 border rounded text-sm">
            <option value="1">1 - 輕微</option><option value="2">2 - 中等</option><option value="3">3 - 嚴重</option><option value="4">4 - 災難</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium">頻率 (1~4)</label>
          <select name="likelihood" onchange="calculateCardRisk(this)" class="w-full p-1 border rounded text-sm">
            <option value="1">1 - 極罕見</option><option value="2">2 - 偶爾</option><option value="3">3 - 經常</option><option value="4">4 - 極頻繁</option>
          </select>
        </div>
        <div class="text-center">
          <span class="block text-[10px] text-gray-400">風險等級</span>
          <span class="risk-val text-lg font-black text-blue-600">1</span>
        </div>
      </div>
      <div class="space-y-2 pt-1">
        <p class="text-xs font-bold text-gray-700">五大控制措施（點選現有或自行輸入）</p>
        
        <input type="text" name="control_elimination" list="list-${cardId}-elimination" placeholder="1. 消除 (Elimination)" class="w-full p-1.5 text-xs border rounded bg-white">
        <datalist id="list-${cardId}-elimination">${elimOpts}</datalist>
        
        <input type="text" name="control_substitution" list="list-${cardId}-substitution" placeholder="2. 替代 (Substitution)" class="w-full p-1.5 text-xs border rounded bg-white">
        <datalist id="list-${cardId}-substitution">${subOpts}</datalist>
        
        <input type="text" name="control_engineering" list="list-${cardId}-engineering" placeholder="3. 工程控制 (Engineering)" class="w-full p-1.5 text-xs border rounded bg-white">
        <datalist id="list-${cardId}-engineering">${engOpts}</datalist>
        
        <input type="text" name="control_administrative" list="list-${cardId}-administrative" placeholder="4. 管理控制 (Administrative)" class="w-full p-1.5 text-xs border rounded bg-white">
        <datalist id="list-${cardId}-administrative">${adminOpts}</datalist>
        
        <input type="text" name="control_ppe" list="list-${cardId}-ppe" placeholder="5. 個人防護具 (PPE)" class="w-full p-1.5 text-xs border rounded bg-white">
        <datalist id="list-${cardId}-ppe">${ppeOpts}</datalist>
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', cardHtml);
}

    function calculateCardRisk(selectEl) {
      let card = selectEl.closest('.border');
      let sev = Number(card.querySelector('[name="severity"]').value);
      let lik = Number(card.querySelector('[name="likelihood"]').value);
      let riskEl = card.querySelector('.risk-val');
      let risk = sev * lik;
      riskEl.innerText = risk;
      riskEl.className = `risk-val text-lg font-black ${risk >= 10 ? 'text-red-600' : risk >= 5 ? 'text-orange-500' : 'text-green-600'}`;
    }

    async function submitAssessment(e) {
      e.preventDefault();
      let hazardCards = document.querySelectorAll('#hazards-container > div');
      if (hazardCards.length === 0) { alert("請至少新增一個危害項目！"); return; }

      let hazardsData = [];
      hazardCards.forEach(card => {
        hazardsData.push({
          hazard_type: card.querySelector('[name="hazard_type"]').value,
          hazard_desc: card.querySelector('[name="hazard_desc"]').value,
          severity: card.querySelector('[name="severity"]').value,
          likelihood: card.querySelector('[name="likelihood"]').value,
          control_elimination: card.querySelector('[name="control_elimination"]').value,
          control_substitution: card.querySelector('[name="control_substitution"]').value,
          control_engineering: card.querySelector('[name="control_engineering"]').value,
          control_administrative: card.querySelector('[name="control_administrative"]').value,
          control_ppe: card.querySelector('[name="control_ppe"]').value
        });
      });

      let payload = {
        action: "createAssessment",
        assessment_name: document.getElementById('assessment_name').value,
        creator: document.getElementById('creator').value,
        hazards: hazardsData
      };

      try {
        let res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
        let json = await res.json();
        if (json.status === "success") {
          alert("提案已送出！等待管理員審批通過後即會生成 QR Code。");
          document.getElementById('assessment-form').reset();
          document.getElementById('hazards-container').innerHTML = '';
          addHazardCard();
          switchTab('search');
        } else { alert("送出失敗"); }
      } catch (err) { alert("網路異常"); }
    }

    async function performSearch() {
      let keyword = document.getElementById('search-keyword').value;
      try {
        let res = await fetch(`${GAS_API_URL}?action=search&keyword=${encodeURIComponent(keyword)}`);
        let json = await res.json();
        let container = document.getElementById('search-results');
        
        if (json.status === "success" && json.results.length > 0) {
          container.innerHTML = json.results.map(r => `
            <div onclick='showDetailModal(${JSON.stringify(r)})' class="border p-4 rounded-lg flex justify-between items-center bg-white shadow-sm hover:bg-blue-50 cursor-pointer transition">
              <div>
                <h4 class="font-bold text-blue-700">${r.assessment_name}</h4>
                <p class="text-xs text-gray-500">建立者: ${r.creator} | 狀態: <span class="${r.status === 'Approved' ? 'text-green-600' : 'text-orange-500'} font-semibold">${r.status}</span> | 包含危害數: ${r.hazards.length} 項</p>
              </div>
              <span class="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded font-medium">查看詳情</span>
            </div>
          `).join('');
        } else { container.innerHTML = `<p class="text-gray-500 text-center py-4">查無相關紀錄。</p>`; }
      } catch (err) { console.error(err); }
    }

    function showDetailModal(item) {
      let hazardsHtml = item.hazards.map((h, index) => `
        <div class="border p-3 rounded bg-gray-50 space-y-1 mb-2 text-xs">
          <div class="font-bold text-blue-900">#${index + 1} 危害種類: ${h.hazard_type} (風險等級: <span class="text-red-600 font-bold">${h.risk_level}</span>)</div>
          <div><strong>詳細描述：</strong>${h.hazard_desc}</div>
          <div class="pt-1 border-t space-y-0.5 text-gray-700">
            <div>• 消除：${h.control_elimination || '無'}</div>
            <div>• 替代：${h.control_substitution || '無'}</div>
            <div>• 工程：${h.control_engineering || '無'}</div>
            <div>• 管理：${h.control_administrative || '無'}</div>
            <div>• PPE：${h.control_ppe || '無'}</div>
          </div>
        </div>
      `).join('');

      let modalHtml = `
        <div id="detail-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-lg max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="text-lg font-bold text-blue-800">${item.assessment_name}</h3>
              <button onclick="document.getElementById('detail-modal').remove()" class="text-gray-500 font-bold">✕ 關閉</button>
            </div>
            <div class="space-y-2">
              <h4 class="text-sm font-semibold text-gray-700">對應的所有危害與控制措施：</h4>
              ${hazardsHtml}
            </div>
            ${item.qr_code_url ? `<div class="text-center pt-2"><p class="text-xs text-gray-500 mb-1">專屬 QR Code</p><img src="${item.qr_code_url}" class="mx-auto w-28 h-28 border p-1 rounded"></div>` : `<p class="text-xs text-gray-400 text-center">尚未審批，無 QR Code。</p>`}
            <button onclick="document.getElementById('detail-modal').remove()" class="w-full bg-gray-800 text-white py-2 rounded text-sm">關閉視窗</button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    async function toggleAdminMode() {
      let pwd = prompt("請輸入管理員密碼：");
      if (pwd === ADMIN_PASSWORD_HASH) loadPendingModal();
      else if (pwd !== null) alert("密碼錯誤！");
    }

    async function loadPendingModal() {
      try {
        let res = await fetch(`${GAS_API_URL}?action=getPending`);
        let json = await res.json();
        let container = document.getElementById('pending-container');
        if (json.status === "success" && json.pending.length > 0) {
          container.innerHTML = json.pending.map(item => `
            <div class="border p-4 rounded-lg bg-gray-50 space-y-2">
              <div class="font-bold text-blue-900">${item.assessment_name} <span class="text-xs font-normal text-gray-500">(建立者: ${item.creator})</span></div>
              <p class="text-xs text-gray-600">包含 ${item.hazards.length} 項危害明細</p>
              <div class="flex gap-2 pt-2">
                <button onclick="approveAction('${item.assessment_id}', true)" class="bg-green-600 text-white px-3 py-1 text-sm rounded">核准並產出 QR Code</button>
                <button onclick="approveAction('${item.assessment_id}', false)" class="bg-red-600 text-white px-3 py-1 text-sm rounded">拒絕</button>
              </div>
            </div>
          `).join('');
        } else { container.innerHTML = `<p class="text-gray-500 text-center py-4">目前無待審批項目。</p>`; }
        document.getElementById('admin-modal').classList.remove('hidden');
      } catch (err) { alert("載入失敗"); }
    }

    function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

    async function approveAction(id, isApproved) {
      let res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "approveAssessment", assessment_id: id, approve: isApproved }) });
      let json = await res.json();
      if (json.status === "success") {
        alert(isApproved ? "已核准並自動生成 QR Code！" : "已拒絕。");
        loadPendingModal();
      }
    }

    async function loadAssessmentDetail(id) {
      let res = await fetch(`${GAS_API_URL}?action=search&keyword=${encodeURIComponent(id)}`);
      let json = await res.json();
      if (json.status === "success" && json.results.length > 0) showDetailModal(json.results[0]);
    }
  </script>
</body>
</html>
