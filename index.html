<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀器與動作風險評估暨五大危害控制管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #print-labels-container, #print-labels-container * {
                visibility: visible;
            }
            #print-labels-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 10px;
            }
            .no-print {
                display: none !important;
            }
            .label-card {
                border: 2px dashed #cbd5e1 !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2 cursor-pointer" onclick="router.goHome()">
                <i class="fa-solid fa-shield-halved"></i> 風險評估與控制管理
            </h1>
            <div class="flex items-center gap-2">
                <!-- 待審核數量徽章按鈕 (紅圈處) -->
                <button onclick="router.goAdmin()" class="relative bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lock"></i> 管理後台
                    <span id="pendingBadge" class="hidden absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">
        
        <!-- 首頁列表 -->
        <div id="view-home" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋儀器/動作名稱、危害或控制方法..." 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button onclick="openScanModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-lg font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-qrcode"></i> 掃描
                    </button>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-plus"></i> 自主提報風險評估
                    </button>
                    <button onclick="exportLabelsPdf()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition no-print">
                        <i class="fa-solid fa-file-pdf"></i> 匯出 QR Code 標籤卡
                    </button>
                </div>
            </div>

            <div id="itemListContainer" class="space-y-3"></div>
        </div>

        <!-- 專門用來放列印標籤的隱藏/動態容器 -->
        <div id="print-labels-container" class="hidden"></div>
        
        <!-- 詳細檢視 -->
        <div id="view-detail" class="hidden space-y-4">
            <button onclick="router.goHome()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 text-sm">
                <i class="fa-solid fa-arrow-left"></i> 返回清單
            </button>
            <div id="detailContent" class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-6"></div>
        </div>

        <!-- 管理員後台 -->
        <div id="view-admin" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <button onclick="router.goHome()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回前台
                </button>
                <h2 class="text-xl font-bold text-slate-800">管理員控制台</h2>
            </div>
            
            <div id="adminLoginCard" class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 max-w-md mx-auto space-y-4">
                <h3 class="font-bold text-lg text-center">請輸入管理員密碼</h3>
                <input type="password" id="adminPasswordInput" placeholder="預設密碼: 8888" class="w-full px-4 py-2 border rounded-lg">
                <button onclick="verifyAdmin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">登入後台</button>
            </div>

            <div id="adminPanel" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="font-bold text-lg text-slate-700 border-b pb-2">待審核的自主提報項目</h3>
                    <div id="pendingListContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- 新增 Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">新增儀器/動作與風險評估</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="addItemForm" onsubmit="submitItemForm(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">儀器 / 動作名稱 <span class="text-red-500">*</span></label>
                    <input type="text" id="formItemName" required class="w-full px-3 py-2 border rounded-lg" placeholder="例如：CNC 操作機台">
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b pb-1">
                        <h4 class="font-bold text-sm text-indigo-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i> 危害種類與控制措施清單</h4>
                        <button type="button" onclick="addHazardBlock()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2.5 py-1 rounded text-xs font-bold transition">
                            <i class="fa-solid fa-plus mr-1"></i> 新增另一個危害種類
                        </button>
                    </div>
                    <div id="hazardsContainer" class="space-y-3"></div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded-lg text-sm">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">送出提報</button>
                </div>
            </form>
        </div>
    </div>

    <!-- QR Code 掃描 Modal -->
    <div id="scanModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold">掃描設備/動作 QR Code</h3>
                <button onclick="closeScanModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="reader" class="w-full"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyP_Jv5s1OVin_8Q5bgl44InNAVNyyjNkzcYH9UdnTsZG6Zs0JMQZT7f5SeY2P1X3BF/exec";
        let globalData = { items: [], masterHazards: [], hazardControlHistory: {} };
        let html5QrCode = null;
        const controlTypes = ['elimination', 'substitution', 'engineering', 'administrative', 'ppe'];
        const controlLabels = {
            elimination: '1. 消除 (Elimination)',
            substitution: '2. 取代 (Substitution)',
            engineering: '3. 工程控制 (Engineering Controls)',
            administrative: '4. 管理控制 (Administrative Controls)',
            ppe: '5. 個人防護具 (PPE)'
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
            checkUrlParams();
        });

        const router = {
            goHome() {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                fetchData();
            },
            goDetail(itemName) {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                renderDetailView(itemName);
            },
            goAdmin() {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
            }
        };

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const itemName = urlParams.get('item');
            if (itemName) {
                const decodedName = decodeURIComponent(itemName);
                const checkInterval = setInterval(() => {
                    if (globalData.items && globalData.items.length > 0) {
                        clearInterval(checkInterval);
                        router.goDetail(decodedName);
                    }
                }, 100);
            }
        }

        async function fetchData() {
            try {
                const res = await fetch(`${API_URL}?action=getData`);
                const json = await res.json();
                if (json.status === 'success') {
                    globalData = json;
                    buildHazardControlHistory();
                    updatePendingBadgeCount(); // 更新待審核數量紅點

                    const approvedItems = globalData.items.map(item => {
                        const validHazards = item.hazards.filter(h => h.status === 'Approved');
                        return { ...item, hazards: validHazards };
                    }).filter(item => item.hazards.length > 0);

                    renderItemList(approvedItems);
                }
            } catch (err) {
                console.error("資料載入失敗", err);
            }
        }

        // 計算並更新頂部紅圈處的待審核數量
        function updatePendingBadgeCount() {
            let pendingCount = 0;
            globalData.items.forEach(item => {
                if (item.hazards) {
                    item.hazards.forEach(h => {
                        if (h.status === 'Pending') pendingCount++;
                    });
                }
            });

            const badge = document.getElementById('pendingBadge');
            if (pendingCount > 0) {
                badge.textContent = pendingCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function buildHazardControlHistory() {
            const historyMap = {};
            globalData.items.forEach(item => {
                if (item.hazards) {
                    item.hazards.forEach(h => {
                        const hName = h.hazard ? h.hazard.trim() : '';
                        if (!hName) return;

                        if (!historyMap[hName]) {
                            historyMap[hName] = {
                                elimination: new Set(),
                                substitution: new Set(),
                                engineering: new Set(),
                                administrative: new Set(),
                                ppe: new Set()
                            };
                        }

                        if (h.controlHierarchy) {
                            controlTypes.forEach(type => {
                                if (Array.isArray(h.controlHierarchy[type])) {
                                    h.controlHierarchy[type].forEach(method => {
                                        if (method && method !== '無') {
                                            historyMap[hName][type].add(method.trim());
                                        }
                                    });
                                }
                            });
                        }
                    });
                }
            });

            globalData.hazardControlHistory = {};
            Object.keys(historyMap).forEach(hName => {
                globalData.hazardControlHistory[hName] = {};
                controlTypes.forEach(type => {
                    globalData.hazardControlHistory[hName][type] = Array.from(historyMap[hName][type]);
                });
            });
        }

        function exportLabelsPdf() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const approvedItems = globalData.items.map(item => {
                const validHazards = item.hazards.filter(h => h.status === 'Approved');
                return { ...item, hazards: validHazards };
            }).filter(item => item.hazards.length > 0);

            const targetItems = approvedItems.filter(item => {
                if (!keyword) return true;
                const matchName = item.itemName.toLowerCase().includes(keyword);
                const matchSub = item.hazards.some(h => {
                    if (h.hazard.toLowerCase().includes(keyword)) return true;
                    return Object.values(h.controlHierarchy).some(methods => 
                        methods.some(m => m.toLowerCase().includes(keyword))
                    );
                });
                return matchName || matchSub;
            });

            if (targetItems.length === 0) {
                alert('目前沒有符合條件的項目可供匯出標籤！');
                return;
            }

            const container = document.getElementById('print-labels-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            targetItems.forEach((item, index) => {
                const cardId = `label-qr-${index}`;
                const currentUrl = `${window.location.origin}${window.location.pathname}?item=${encodeURIComponent(item.itemName)}`;
                
                const cardDiv = document.createElement('div');
                cardDiv.className = "label-card bg-white p-4 rounded-lg border-2 dashed border-slate-300 flex justify-between items-center w-full max-w-[380px] h-[160px] mx-auto shadow-sm";
                cardDiv.innerHTML = `
                    <div class="space-y-1 pr-2 overflow-hidden">
                        <div class="text-[10px] text-indigo-600 font-bold uppercase tracking-wider">風險控制標籤</div>
                        <h4 class="font-bold text-base text-slate-900 truncate" style="max-width: 180px;" title="${item.itemName}">${item.itemName}</h4>
                        <p class="text-[11px] text-slate-500">已核准危害：${item.hazards.length} 項</p>
                        <p class="text-[9px] text-slate-400">請用手機掃描以檢視五大控制措施</p>
                    </div>
                    <div id="${cardId}" class="p-1 bg-white border rounded flex-shrink-0"></div>
                `;
                container.appendChild(cardDiv);

                new QRCode(document.getElementById(cardId), {
                    text: currentUrl,
                    width: 90,
                    height: 90
                });
            });

            setTimeout(() => {
                window.print();
                container.classList.add('hidden');
                container.innerHTML = '';
            }, 500);
        }
        
        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const approvedItems = globalData.items.map(item => {
                const validHazards = item.hazards.filter(h => h.status === 'Approved');
                return { ...item, hazards: validHazards };
            }).filter(item => item.hazards.length > 0);

            const filtered = approvedItems.filter(item => {
                const matchName = item.itemName.toLowerCase().includes(keyword);
                const matchSub = item.hazards.some(h => {
                    if (h.hazard.toLowerCase().includes(keyword)) return true;
                    return Object.values(h.controlHierarchy).some(methods => 
                        methods.some(m => m.toLowerCase().includes(keyword))
                    );
                });
                return matchName || matchSub;
            });
            renderItemList(filtered);
        }

        function renderItemList(items) {
            const container = document.getElementById('itemListContainer');
            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 bg-white rounded-xl border">目前尚無已核准的項目</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center hover:shadow-md transition">
                    <div>
                        <h3 class="font-bold text-base text-slate-800">${item.itemName}</h3>
                        <p class="text-xs text-slate-500 mt-0.5">已核准危害種類：${item.hazards.length} 項</p>
                    </div>
                    <button onclick="router.goDetail('${item.itemName}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                        查看詳情與 QR Code <i class="fa-solid fa-chevron-right ml-1 text-xs"></i>
                    </button>
                </div>
            `).join('');
        }
        
        function renderDetailView(itemName) {
            const item = globalData.items.find(i => i.itemName === itemName);
            const container = document.getElementById('detailContent');
            
            if (!item) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400">找不到該項目「${itemName}」的詳細資料或尚未通過審核。</div>`;
                return;
            }

            const approvedHazards = item.hazards.filter(h => h.status === 'Approved');
            const isFullyApproved = approvedHazards.length > 0;
            const currentUrl = `${window.location.origin}${window.location.pathname}?item=${encodeURIComponent(itemName)}`;

            container.innerHTML = `
                <div class="flex justify-between items-start border-b pb-4">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">${item.itemName}</h2>
                        <p class="text-xs text-slate-500 mt-1">完整風險評估與所有危害之五大控制措施明細</p>
                    </div>
                    ${isFullyApproved ? `<div id="qrcode-box" class="p-2 bg-white border rounded-lg shadow-sm text-center"><div class="text-[10px] text-slate-400 mb-1">設備專屬 QR Code</div></div>` : `<span class="px-2.5 py-1 bg-amber-100 text-amber-800 rounded text-xs font-bold">尚未核准，無 QR Code</span>`}
                </div>
                
                <div class="space-y-6">
                    ${approvedHazards.map((h, idx) => `
                        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                            <div class="flex justify-between items-center border-b pb-2">
                                <span class="font-bold text-indigo-600 text-sm">#${idx + 1} 危害種類：${h.hazard}</span>
                                <span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-xs font-bold">風險等級: ${h.riskLevel} 級 (嚴重:${h.severity} / 頻率:${h.frequency})</span>
                            </div>
                            
                            <div class="space-y-2 pt-1">
                                <div class="text-xs font-bold text-slate-700">五大危害控制措施細項：</div>
                                ${controlTypes.map(type => {
                                    const methods = (h.controlHierarchy && h.controlHierarchy[type]) ? h.controlHierarchy[type] : ['無'];
                                    return `
                                        <div class="bg-white p-2.5 rounded border border-slate-100 text-xs">
                                            <span class="font-bold text-indigo-800 block mb-1">${controlLabels[type]}</span>
                                            <ul class="list-disc list-inside text-slate-600 space-y-0.5">
                                                ${methods.map(m => `<li>${m}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            if (isFullyApproved) {
                const qrBox = document.getElementById("qrcode-box");
                qrBox.innerHTML = '<div class="text-[10px] text-slate-400 mb-1">設備專屬 QR Code</div>';
                new QRCode(qrBox, {
                    text: currentUrl,
                    width: 100,
                    height: 100
                });
            }
        }

        function addHazardBlock() {
            const container = document.getElementById('hazardsContainer');
            const blockId = 'hazard-block-' + Date.now();
            
            const existingBlocks = container.querySelectorAll('.hazard-block');
            existingBlocks.forEach(b => {
                collapseHazardBlock(b);
            });

            const hazardOptions = `<option value="">-- 從歷史常用危害詞庫選擇 --</option>` +
                (globalData.masterHazards ? globalData.masterHazards.map(h => `<option value="${h}">${h}</option>`).join('') : '');

            const div = document.createElement('div');
            div.className = "p-4 bg-slate-50 border rounded-xl space-y-3 hazard-block transition-all shadow-sm";
            div.id = blockId;
            div.setAttribute('data-expanded', 'true');
            
            div.innerHTML = `
                <div class="flex justify-between items-center cursor-pointer block-header" onclick="toggleHazardBlock('${blockId}')">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-indigo-600"><i class="fa-solid fa-chevron-down mr-1 toggle-icon"></i> 危害種類區塊 (編輯中)</span>
                        <span class="text-xs font-semibold text-slate-500 preview-title"></span>
                    </div>
                    <button type="button" onclick="event.stopPropagation(); document.getElementById('${blockId}').remove()" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-trash mr-1"></i>刪除</button>
                </div>
                <div class="block-content space-y-3 pt-2">
                    <div>
                        <label class="block text-xs font-medium mb-1">危害種類 <span class="text-red-500">*</span></label>
                        <select onchange="onHazardSelectChange('${blockId}', this.value)" class="w-full px-2 py-1.5 border rounded-lg mb-1 text-xs bg-white">${hazardOptions}</select>
                        <input type="text" name="hazardName" oninput="onHazardInputChange('${blockId}', this.value)" required class="w-full px-3 py-1.5 border rounded-lg text-xs" placeholder="或自行輸入危害種類描述">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium mb-1">嚴重度 (1~4)</label>
                            <select name="severity" class="w-full px-2 py-1.5 border rounded-lg text-xs bg-white">
                                <option value="1">1 級 (輕微)</option>
                                <option value="2">2 級 (中等)</option>
                                <option value="3">3 級 (嚴重)</option>
                                <option value="4">4 級 (極嚴重)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">發生頻率 (1~4)</label>
                            <select name="frequency" class="w-full px-2 py-1.5 border rounded-lg text-xs bg-white">
                                <option value="1">1 級 (極低)</option>
                                <option value="2">2 級 (偶發)</option>
                                <option value="3">3 級 (經常)</option>
                                <option value="4">4 級 (極高)</option>
                            </select>
                        </div>
                    </div>
                    <div class="space-y-2 pt-2 border-t">
                        <div class="text-xs font-bold text-slate-700">五大控制措施填寫：</div>
                        ${controlTypes.map(type => `
                            <div class="space-y-1" data-control-type="${type}">
                                <div class="flex justify-between items-center">
                                    <label class="text-[11px] font-semibold text-slate-600">${controlLabels[type]}</label>
                                    <button type="button" onclick="addControlRow('${blockId}', '${type}')" class="text-[10px] text-indigo-600 hover:underline">+ 方法</button>
                                </div>
                                <div class="sub-container-${type} space-y-1"></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            container.prepend(div);
            controlTypes.forEach(type => addControlRow(blockId, type));
        }

        function toggleHazardBlock(blockId) {
            const block = document.getElementById(blockId);
            const isExpanded = block.getAttribute('data-expanded') === 'true';
            if (isExpanded) {
                collapseHazardBlock(block);
            } else {
                expandHazardBlock(block);
            }
        }

        function collapseHazardBlock(block) {
            block.setAttribute('data-expanded', 'false');
            block.querySelector('.block-content').classList.add('hidden');
            block.querySelector('.toggle-icon').className = "fa-solid fa-chevron-right mr-1 toggle-icon";
            
            const hazardInput = block.querySelector('input[name="hazardName"]');
            const previewSpan = block.querySelector('.preview-title');
            const hName = hazardInput ? hazardInput.value.trim() : '';
            previewSpan.textContent = hName ? `(已填寫: ${hName})` : '(尚未填寫危害名稱)';
            block.classList.add('bg-slate-100');
        }

        function expandHazardBlock(block) {
            block.setAttribute('data-expanded', 'true');
            block.querySelector('.block-content').classList.remove('hidden');
            block.querySelector('.toggle-icon').className = "fa-solid fa-chevron-down mr-1 toggle-icon";
            block.querySelector('.preview-title').textContent = '';
            block.classList.remove('bg-slate-100');
        }

        function onHazardSelectChange(blockId, selectedValue) {
            const block = document.getElementById(blockId);
            const input = block.querySelector('input[name="hazardName"]');
            input.value = selectedValue;
            updateControlDropdownsForBlock(blockId, selectedValue);
        }

        function onHazardInputChange(blockId, typedValue) {
            updateControlDropdownsForBlock(blockId, typedValue.trim());
        }

        function updateControlDropdownsForBlock(blockId, hazardName) {
            const block = document.getElementById(blockId);
            
            controlTypes.forEach(type => {
                const subContainer = block.querySelector(`.sub-container-${type}`);
                if (!subContainer) return;

                let availableMethods = [];
                if (globalData.hazardControlHistory && 
                    globalData.hazardControlHistory[hazardName] && 
                    globalData.hazardControlHistory[hazardName][type]) {
                    availableMethods = globalData.hazardControlHistory[hazardName][type];
                }

                const controlOptionsHtml = `<option value="">-- 歷史詞庫 --</option>` +
                    availableMethods.map(c => `<option value="${c}">${c}</option>`).join('');

                const selects = subContainer.querySelectorAll('select.control-history-select');
                selects.forEach(sel => {
                    const currentVal = sel.value;
                    sel.innerHTML = controlOptionsHtml;
                    sel.value = currentVal;
                });
            });
        }

        function addControlRow(blockId, type, defaultValue = '') {
            const block = document.getElementById(blockId);
            const container = block.querySelector(`.sub-container-${type}`);
            const hazardNameInput = block.querySelector('input[name="hazardName"]');
            const currentHazard = hazardNameInput ? hazardNameInput.value.trim() : '';

            let availableMethods = [];
            if (globalData.hazardControlHistory && 
                globalData.hazardControlHistory[currentHazard] && 
                globalData.hazardControlHistory[currentHazard][type]) {
                availableMethods = globalData.hazardControlHistory[currentHazard][type];
            }

            const controlOptions = `<option value="">-- 歷史詞庫 --</option>` +
                availableMethods.map(c => `<option value="${c}">${c}</option>`).join('');

            const row = document.createElement('div');
            row.className = "flex gap-1 items-center";
            row.innerHTML = `
                <select onchange="this.nextElementSibling.value = this.value" class="control-history-select w-1/3 px-1 py-1 border rounded text-[11px] bg-white">${controlOptions}</select>
                <input type="text" value="${defaultValue}" required class="flex-grow px-2 py-1 border rounded text-[11px]" placeholder="控制方法">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-400 hover:text-red-600 px-1 text-xs"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(row);
        }

        function openAddModal() { 
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('hazardsContainer').innerHTML = '';
            addHazardBlock();
        }

        function closeAddModal() { 
            document.getElementById('addModal').classList.add('hidden'); 
            document.getElementById('addItemForm').reset();
        }

        async function submitItemForm(e) {
            e.preventDefault();
            const itemName = document.getElementById('formItemName').value;
            const hazardBlocks = document.querySelectorAll('.hazard-block');
            
            if (hazardBlocks.length === 0) {
                alert('請至少新增一個危害種類！');
                return;
            }

            const hazardsList = [];
            hazardBlocks.forEach(block => {
                const hazard = block.querySelector('input[name="hazardName"]').value;
                const severity = block.querySelector('select[name="severity"]').value;
                const frequency = block.querySelector('select[name="frequency"]').value;
                
                const controlHierarchy = {};
                controlTypes.forEach(type => {
                    const inputs = block.querySelectorAll(`[data-control-type="${type}"] input`);
                    controlHierarchy[type] = Array.from(inputs).map(i => i.value).filter(Boolean);
                    if (controlHierarchy[type].length === 0) controlHierarchy[type] = ['無'];
                });

                hazardsList.push({ hazard, severity, frequency, controlHierarchy });
            });

            const payload = {
                action: 'addItem',
                itemName: itemName,
                hazardsList: hazardsList,
                isUserSubmit: true
            };

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const json = await res.json();
            if (json.status === 'success') {
                alert('已成功送出自主提報！將等待管理員審核。');
                closeAddModal();
                fetchData();
            }
        }

        function openScanModal() {
            document.getElementById('scanModal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                decodedText => { 
                    closeScanModal(); 
                    window.location.href = decodedText; 
                },
                error => {}
            ).catch(err => console.error(err));
        }

        function closeScanModal() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => document.getElementById('scanModal').classList.add('hidden'));
            } else {
                document.getElementById('scanModal').classList.add('hidden');
            }
        }

        async function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            const res = await fetch(`${API_URL}?action=verifyAdmin&password=${encodeURIComponent(pass)}`);
            const json = await res.json();
            if (json.authorized) {
                document.getElementById('adminLoginCard').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadPendingItems();
            } else {
                alert('密碼錯誤！');
            }
        }

        function loadPendingItems() {
            const container = document.getElementById('pendingListContainer');
            const pendingItems = [];
            globalData.items.forEach(item => {
                item.hazards.forEach(h => {
                    if (h.status === 'Pending') pendingItems.push({ ...h, itemName: item.itemName });
                });
            });

            if (pendingItems.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400">目前沒有待審核的項目。</p>`;
                return;
            }

            container.innerHTML = pendingItems.map(p => `
                <div class="p-4 border rounded-lg bg-slate-50 space-y-3">
                    <div class="flex justify-between items-start border-b pb-2">
                        <div>
                            <div class="font-bold text-sm text-indigo-600">儀器/動作：${p.itemName}</div>
                            <div class="text-xs text-slate-700 font-semibold mt-1">危害種類：${p.hazard}</div>
                        </div>
                        <span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-xs font-bold">風險等級: ${p.riskLevel} 級 (嚴重:${p.severity} / 頻率:${p.frequency})</span>
                    </div>

                    <div class="space-y-1.5 pt-1">
                        <div class="text-[11px] font-bold text-slate-600">五大危害控制措施細項：</div>
                        ${controlTypes.map(type => {
                            const methods = (p.controlHierarchy && p.controlHierarchy[type]) ? p.controlHierarchy[type] : ['無'];
                            return `
                                <div class="bg-white p-2 rounded border border-slate-200 text-xs">
                                    <span class="font-bold text-indigo-800 block mb-0.5">${controlLabels[type]}</span>
                                    <ul class="list-disc list-inside text-slate-600 space-y-0.5">
                                        ${methods.map(m => `<li>${m}</li>`).join('')}
                                    </ul>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="flex justify-end gap-2 pt-2 border-t">
                        <button onclick="updateStatus('${p.id}', 'Approved')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded text-xs font-medium transition">核准</button>
                        <button onclick="updateStatus('${p.id}', 'Rejected')" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded text-xs font-medium transition">拒絕</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(id, status) {
            globalData.items.forEach(item => {
                item.hazards.forEach(h => {
                    if (h.id === id) {
                        h.status = status;
                    }
                });
            });

            loadPendingItems();
            updatePendingBadgeCount(); // 審核後立即更新頂部數量徽章

            try {
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'updateItemStatus', id, status }) 
                });
                const json = await res.json();
                if (json.status !== 'success') {
                    alert('後端狀態更新失敗，請重新整理。');
                    fetchData();
                }
            } catch (err) {
                console.error("更新狀態發生錯誤", err);
            }
        }
    </script>
</body>
</html>
