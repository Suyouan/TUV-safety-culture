<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀器與動作風險評估暨五大危害控制管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #print-labels-container, #print-labels-container * {
                visibility: visible;
            }
            #print-labels-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 10px;
            }
            .no-print {
                display: none !important;
            }
            .label-card {
                border: 2px dashed #cbd5e1 !important;
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 全螢幕 Loading 提示遮罩 -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/40 z-[9999] hidden flex flex-col items-center justify-center backdrop-blur-[2px]">
        <div class="bg-white px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3 border border-slate-100">
            <i class="fa-solid fa-spinner fa-spin text-indigo-600 text-2xl"></i>
            <span id="loadingText" class="font-bold text-slate-700 text-sm">正在處理中，請稍候...</span>
        </div>
    </div>

    <!-- 圖片燈箱 Modal -->
    <div id="lightboxModal" class="fixed inset-0 bg-black/80 z-[10000] hidden flex items-center justify-center p-4 cursor-pointer" onclick="closeLightbox()">
        <div class="relative max-w-3xl w-full flex flex-col items-center">
            <img id="lightboxImg" src="" class="max-h-[85vh] max-w-full rounded-lg shadow-2xl object-contain bg-white">
            <span class="text-white text-xs mt-3 bg-black/50 px-3 py-1 rounded-full">點擊任意處關閉圖片</span>
        </div>
    </div>

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2 cursor-pointer" onclick="router.goHome()">
                <i class="fa-solid fa-shield-halved"></i> 風險評估與控制管理
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="router.goAdmin()" class="relative bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lock"></i> 管理後台
                    <span id="pendingBadge" class="hidden absolute -top-1.5 -right-1.5 bg-rose-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full shadow-sm">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">
        
        <!-- 首頁列表 -->
        <div id="view-home" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <div class="flex flex-col sm:flex-row gap-2">
                    <div class="relative flex-grow">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋儀器/動作名稱、危害或控制方法..." 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <!-- 風險等級篩選下拉選單 -->
                    <div class="sm:w-48">
                        <select id="riskFilterSelect" onchange="handleSearch()" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                            <option value="">-- 篩選風險等級 --</option>
                            <option value="4">第 4 級 (極嚴重)</option>
                            <option value="3">第 3 級 (嚴重)</option>
                            <option value="2">第 2 級 (中等)</option>
                            <option value="1">第 1 級 (輕微)</option>
                        </select>
                    </div>
                    <button onclick="openScanModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-lg font-medium flex items-center justify-center gap-2 transition text-sm">
                        <i class="fa-solid fa-qrcode"></i> 掃描
                    </button>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-plus"></i> 自主提報風險評估
                    </button>
                    <button onclick="exportLabelsPdf()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition no-print">
                        <i class="fa-solid fa-file-pdf"></i> 匯出 QR Code 標籤卡
                    </button>
                </div>
            </div>

            <div id="itemListContainer" class="space-y-3"></div>
        </div>

        <!-- 專門用來放列印標籤的隱藏/動態容器 -->
        <div id="print-labels-container" class="hidden"></div>
        
        <!-- 詳細檢視 -->
        <div id="view-detail" class="hidden space-y-4">
            <button onclick="router.goHome()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 text-sm">
                <i class="fa-solid fa-arrow-left"></i> 返回清單
            </button>
            <div id="detailContent" class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-6"></div>
        </div>

        <!-- 管理員後台 -->
        <div id="view-admin" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <button onclick="router.goHome()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回前台
                </button>
                <h2 class="text-xl font-bold text-slate-800">管理員控制台</h2>
            </div>
            
            <!-- 登入卡片 -->
            <div id="adminLoginCard" class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 max-w-md mx-auto space-y-4">
                <h3 class="font-bold text-lg text-center">請輸入管理員密碼</h3>
                <input type="password" id="adminPasswordInput" placeholder="請輸入管理員密碼" class="w-full px-4 py-2 border rounded-lg">
                <button onclick="verifyAdmin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">登入後台</button>
            </div>

            <!-- 管理員後台主面板 -->
            <div id="adminPanel" class="hidden space-y-6">
                
                <div id="adminDashboardMenu" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div onclick="openAdminSubView('pending')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg font-bold">
                                <i class="fa-solid fa-clipboard-check"></i>
                            </div>
                            <h3 class="font-bold text-base text-slate-800">待審核項目 (危害與照片)</h3>
                            <p class="text-xs text-slate-500">審核同仁自主提報的風險評估與設備照片變更申請。</p>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t text-xs">
                            <span id="dashboardPendingCount" class="font-bold text-indigo-600">載入中...</span>
                            <span class="text-indigo-600 font-medium">進入管理 <i class="fa-solid fa-chevron-right ml-1"></i></span>
                        </div>
                    </div>

                    <div onclick="openAdminSubView('manage')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg font-bold">
                                <i class="fa-solid fa-folder-open"></i>
                            </div>
                            <h3 class="font-bold text-base text-slate-800">現有風險評估管理</h3>
                            <p class="text-xs text-slate-500">檢視、查閱或刪除系統中現有的所有設備評估。</p>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t text-xs">
                            <span id="dashboardItemCount" class="font-bold text-indigo-600">載入中...</span>
                            <span class="text-indigo-600 font-medium">進入管理 <i class="fa-solid fa-chevron-right ml-1"></i></span>
                        </div>
                    </div>

                    <div onclick="openAdminSubView('password')" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hover:shadow-md hover:border-indigo-300 transition cursor-pointer flex flex-col justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="w-10 h-10 rounded-lg bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg font-bold">
                                <i class="fa-solid fa-key"></i>
                            </div>
                            <h3 class="font-bold text-base text-slate-800">更改管理員密碼</h3>
                            <p class="text-xs text-slate-500">變更後台登入密碼，確保系統安全性。</p>
                        </div>
                        <div class="flex justify-between items-center pt-2 border-t text-xs">
                            <span class="text-slate-400">系統設定</span>
                            <span class="text-indigo-600 font-medium">變更密碼 <i class="fa-solid fa-chevron-right ml-1"></i></span>
                        </div>
                    </div>
                </div>

                <div id="adminSubViewContainer" class="hidden space-y-4">
                    <button onclick="backToAdminMenu()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 text-sm">
                        <i class="fa-solid fa-arrow-left"></i> 返回管理選單
                    </button>
                    
                    <div id="subView-pending" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-4">
                        <h3 class="font-bold text-lg text-slate-700 border-b pb-2">待審核的自主提報項目與照片申請</h3>
                        <div id="pendingListContainer" class="space-y-3"></div>
                    </div>

                    <div id="subView-manage" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-4">
                        <h3 class="font-bold text-lg text-slate-700 border-b pb-2">現有風險評估項目管理</h3>
                        <div id="adminManageListContainer" class="space-y-3"></div>
                    </div>

                    <div id="subView-password" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-4 max-w-md mx-auto">
                        <h3 class="font-bold text-lg text-slate-700 border-b pb-2">更改管理員密碼</h3>
                        <div class="space-y-3 text-sm">
                            <div>
                                <label class="block text-xs font-medium mb-1">原密碼</label>
                                <input type="password" id="oldPasswordInput" class="w-full px-3 py-2 border rounded-lg" placeholder="請輸入原密碼">
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1">新密碼</label>
                                <input type="password" id="newPasswordInput" class="w-full px-3 py-2 border rounded-lg" placeholder="請輸入新密碼">
                            </div>
                            <div>
                                <label class="block text-xs font-medium mb-1">確認新密碼</label>
                                <input type="password" id="confirmPasswordInput" class="w-full px-3 py-2 border rounded-lg" placeholder="請再次輸入新密碼">
                            </div>
                            <button onclick="changeAdminPassword()" class="w-full bg-slate-800 text-white py-2 rounded-lg font-medium hover:bg-slate-900">更新密碼</button>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- 新增 Modal -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">新增儀器/動作與風險評估</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="addItemForm" onsubmit="submitItemForm(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">儀器 / 動作名稱 <span class="text-red-500">*</span></label>
                    <input type="text" id="formItemName" required class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="例如：CNC 操作機台">
                </div>

                <div class="space-y-4">
                    <div class="flex justify-between items-center border-b pb-1">
                        <h4 class="font-bold text-sm text-indigo-700"><i class="fa-solid fa-triangle-exclamation mr-1"></i> 危害種類與控制措施清單</h4>
                        <button type="button" onclick="addHazardBlock()" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-2.5 py-1 rounded text-xs font-bold transition">
                            <i class="fa-solid fa-plus mr-1"></i> 新增另一個危害種類
                        </button>
                    </div>
                    <div id="hazardsContainer" class="space-y-3"></div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded-lg text-sm">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">送出提報</button>
                </div>
            </form>
        </div>
    </div>

    <!-- QR Code 掃描 Modal -->
    <div id="scanModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold">掃描設備/動作 QR Code</h3>
                <button onclick="closeScanModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="reader" class="w-full"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyP_Jv5s1OVin_8Q5bgl44InNAVNyyjNkzcYH9UdnTsZG6Zs0JMQZT7f5SeY2P1X3BF/exec";
        let globalData = { items: [], masterHazards: [], hazardControlHistory: {} };
        let html5QrCode = null;
        const controlTypes = ['elimination', 'substitution', 'engineering', 'administrative', 'ppe'];
        const controlLabels = {
            elimination: '1. 消除 (Elimination)',
            substitution: '2. 取代 (Substitution)',
            engineering: '3. 工程控制 (Engineering Controls)',
            administrative: '4. 管理控制 (Administrative Controls)',
            ppe: '5. 個人防護具 (PPE)'
        };

        // 頁面載入時優先初始化資料與解析路由
        window.addEventListener('DOMContentLoaded', async () => {
            await initDataAsync();
        });

        function showLoading(text = "正在處理中，請稍候...") {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function openLightbox(imgSrc) {
            document.getElementById('lightboxImg').src = imgSrc;
            document.getElementById('lightboxModal').classList.remove('hidden');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
        }

        const router = {
            goHome() {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                fetchData(false);
            },
            goDetail(itemName) {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                renderDetailView(itemName);
            },
            goAdmin() {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                backToAdminMenu();
                fetchData(false);
            }
        };

        // 確保資料載入完成後才去解析網址並跳轉詳細頁
        async function initDataAsync() {
            const cached = sessionStorage.getItem('safety_culture_cache');
            if (cached) {
                try {
                    globalData = JSON.parse(cached);
                    processAndRenderData();
                } catch (e) {
                    console.error("快取解析失敗", e);
                }
            }
            // 強制從雲端抓取最新資料以確保手機端不會發生空白
            await fetchData(true);
            checkUrlParamsAfterLoad();
        }

        function checkUrlParamsAfterLoad() {
            const urlParams = new URLSearchParams(window.location.search);
            const itemName = urlParams.get('item');
            if (itemName) {
                const decodedName = decodeURIComponent(itemName);
                router.goDetail(decodedName);
            }
        }

        async function fetchData(showLoader = true) {
            if (showLoader) {
                showLoading("正在載入風險評估資料，請稍候...");
            }
            try {
                const res = await fetch(`${API_URL}?action=getData`);
                const json = await res.json();
                if (json.status === 'success') {
                    globalData = json;
                    sessionStorage.setItem('safety_culture_cache', JSON.stringify(json));
                    processAndRenderData();
                }
            } catch (err) {
                console.error("資料載入失敗", err);
                if (showLoader) {
                    alert("資料載入失敗，請檢查網路連線或稍後再試。");
                }
            } finally {
                if (showLoader) {
                    hideLoading();
                }
            }
        }

        function processAndRenderData() {
            buildHazardControlHistory();
            updatePendingBadgeCount();
            updateDashboardCounts();

            const approvedItems = globalData.items.map(item => {
                const validHazards = item.hazards.filter(h => h.status === 'Approved');
                return { ...item, hazards: validHazards };
            }).filter(item => item.hazards.length > 0);

            renderItemList(approvedItems);
            
            renderAdminPendingList();
            renderAdminManageList();
        }

        function updatePendingBadgeCount() {
            let pendingCount = 0;
            globalData.items.forEach(item => {
                if (item.hazards) {
                    item.hazards.forEach(h => {
                        if (h.status === 'Pending') pendingCount++;
                    });
                }
                if (item.photoStatus === 'Pending' || item.photoDeleteRequested) {
                    pendingCount++;
                }
            });

            const badge = document.getElementById('pendingBadge');
            if (pendingCount > 0) {
                badge.textContent = pendingCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function updateDashboardCounts() {
            let pendingCount = 0;
            globalData.items.forEach(item => {
                if (item.hazards) {
                    item.hazards.forEach(h => {
                        if (h.status === 'Pending') pendingCount++;
                    });
                }
                if (item.photoStatus === 'Pending' || item.photoDeleteRequested) {
                    pendingCount++;
                }
            });

            const pendingSpan = document.getElementById('dashboardPendingCount');
            if (pendingSpan) {
                pendingSpan.textContent = pendingCount > 0 ? `有 ${pendingCount} 項待審核` : '目前無待審核';
            }

            const itemCountSpan = document.getElementById('dashboardItemCount');
            if (itemCountSpan) {
                const totalItems = globalData.items ? globalData.items.length : 0;
                itemCountSpan.textContent = `共 ${totalItems} 個設備評估項目`;
            }
        }

        function buildHazardControlHistory() {
            const historyMap = {};
            globalData.items.forEach(item => {
                if (item.hazards) {
                    item.hazards.forEach(h => {
                        const hName = h.hazard ? h.hazard.trim() : '';
                        if (!hName) return;

                        if (!historyMap[hName]) {
                            historyMap[hName] = {
                                elimination: new Set(),
                                substitution: new Set(),
                                engineering: new Set(),
                                administrative: new Set(),
                                ppe: new Set()
                            };
                        }

                        if (h.controlHierarchy) {
                            controlTypes.forEach(type => {
                                if (Array.isArray(h.controlHierarchy[type])) {
                                    h.controlHierarchy[type].forEach(method => {
                                        if (method && method !== '無') {
                                            historyMap[hName][type].add(method.trim());
                                        }
                                    });
                                }
                            });
                        }
                    });
                }
            });

            globalData.hazardControlHistory = {};
            Object.keys(historyMap).forEach(hName => {
                globalData.hazardControlHistory[hName] = {};
                controlTypes.forEach(type => {
                    globalData.hazardControlHistory[hName][type] = Array.from(historyMap[hName][type]);
                });
            });
        }

        async function verifyAdmin() {
            const password = document.getElementById('adminPasswordInput').value;
            if (!password) {
                alert('請輸入管理員密碼');
                return;
            }
            showLoading("驗證中...");
            try {
                const res = await fetch(`${API_URL}?action=verifyAdmin&password=${encodeURIComponent(password)}`);
                const json = await res.json();
                hideLoading();
                if (json.status === 'success' && json.authorized) {
                    document.getElementById('adminLoginCard').classList.add('hidden');
                    document.getElementById('adminPanel').classList.remove('hidden');
                    updateDashboardCounts();
                    renderAdminPendingList();
                    renderAdminManageList();
                } else {
                    alert(json.message || '密碼錯誤');
                }
            } catch (err) {
                hideLoading();
                alert('驗證連線失敗');
            }
        }

        function openAdminSubView(viewType) {
            document.getElementById('adminDashboardMenu').classList.add('hidden');
            document.getElementById('adminSubViewContainer').classList.remove('hidden');

            document.getElementById('subView-pending').classList.add('hidden');
            document.getElementById('subView-manage').classList.add('hidden');
            document.getElementById('subView-password').classList.add('hidden');

        function handlePhotoUpload(event, itemName) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            showLoading("正在壓縮並上傳照片...");
            reader.onload = async function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const MAX_WIDTH = 600;
                    const MAX_HEIGHT = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);
                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    try {
                        const res = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: 'uploadPhoto',
                                itemName: itemName,
                                photoBase64: compressedBase64
                            })
                        });
                        const json = await res.json();
                        hideLoading();
                        if (json.status === 'success') {
                            alert('設備照片已成功上傳，等待管理員審核！');
                            sessionStorage.removeItem('safety_culture_cache');
                            await fetchData(false);
                            router.goDetail(itemName);
                        } else {
                            alert(json.message || '上傳失敗');
                        }
                    } catch (err) {
                        hideLoading();
                        alert('網路連線失敗');
                    }
                };
            };
            reader.readAsDataURL(file);
        }

                                            </ul>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;}).join('')}
                </div>
            `;

            if (isFullyApproved) {
                const qrBox = document.getElementById("qrcode-box");
                qrBox.innerHTML = '';
                new QRCode(qrBox, {
                    text: currentUrl,
                    width: 88,
                    height: 88
                });
            }
        }

        function toggleDetailAccordion(accordionId) {
            const contentEl = document.getElementById(accordionId);
            const iconEl = document.getElementById(`icon-${accordionId}`);
            
            if (contentEl.classList.contains('hidden')) {
                contentEl.classList.remove('hidden');
                iconEl.className = "fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform";
            } else {
                contentEl.classList.add('hidden');
                iconEl.className = "fa-solid fa-chevron-right text-indigo-600 text-xs transition-transform";
            }
        }

        function toggleAllDetailAccordions(expand) {
            const items = document.querySelectorAll('.detail-accordion-item');
            items.forEach((item, idx) => {
                const contentEl = document.getElementById(`detail-accordion-${idx}`);
                const iconEl = document.getElementById(`icon-detail-accordion-${idx}`);
                if (!contentEl || !iconEl) return;

                if (expand) {
                    contentEl.classList.remove('hidden');
                    iconEl.className = "fa-solid fa-chevron-down text-indigo-600 text-xs transition-transform";
                } else {
                    contentEl.classList.add('hidden');
                    iconEl.className = "fa-solid fa-chevron-right text-indigo-600 text-xs transition-transform";
                }
            });
        }

        function openAddModal() {
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('hazardsContainer').innerHTML = '';
            addHazardBlock();
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        function addHazardBlock() {
            const container = document.getElementById('hazardsContainer');
            const blockId = 'hazard-block-' + Date.now();
            
            const existingBlocks = container.querySelectorAll('.hazard-block');
            existingBlocks.forEach(b => {
                collapseHazardBlock(b);
            });

            const hazardOptions = `<option value="">-- 從歷史常用危害詞庫選擇 --</option>` +
                (globalData.masterHazards ? globalData.masterHazards.map(h => `<option value="${h}">${h}</option>`).join('') : '');

            const div = document.createElement('div');
            div.className = "p-4 bg-slate-50 border rounded-xl space-y-3 hazard-block transition-all shadow-sm";
            div.id = blockId;
            div.setAttribute('data-expanded', 'true');
            
            div.innerHTML = `
                <div class="flex justify-between items-center cursor-pointer block-header" onclick="toggleHazardBlock('${blockId}')">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-indigo-600"><i class="fa-solid fa-chevron-down mr-1 toggle-icon"></i> 危害種類區塊 (編輯中)</span>
                        <span class="text-xs font-semibold text-slate-500 preview-title"></span>
                    </div>
                    <button type="button" onclick="event.stopPropagation(); document.getElementById('${blockId}').remove()" class="text-red-500 hover:text-red-700 text-xs"><i class="fa-solid fa-trash mr-1"></i>刪除</button>
                </div>
                <div class="block-content space-y-3 pt-2">
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label class="block text-xs font-medium">危害種類 <span class="text-red-500">*</span></label>
                            <button type="button" id="btn-toggle-hazard-${blockId}" onclick="toggleHazardInputMode('${blockId}')" class="text-[11px] text-indigo-600 hover:underline font-medium">
                                + 沒有想要的？手動輸入
                            </button>
                        </div>
                        <select id="hazard-select-${blockId}" onchange="onHazardSelectChange('${blockId}', this.value)" class="w-full px-2 py-1.5 border rounded-lg text-xs bg-white">${hazardOptions}</select>
                        <input type="text" id="hazard-input-${blockId}" oninput="onHazardInputChange('${blockId}', this.value)" class="hidden w-full px-3 py-1.5 border rounded-lg text-xs" placeholder="請輸入自訂危害種類描述...">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs font-medium mb-1">嚴重度 (1~4)</label>
                            <select name="severity" class="w-full px-2 py-1.5 border rounded-lg text-xs bg-white">
                                <option value="1">1 級 (輕微)</option>
                                <option value="2">2 級 (中等)</option>
                                <option value="3">3 級 (嚴重)</option>
                                <option value="4">4 級 (極嚴重)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium mb-1">發生頻率 (1~4)</label>
                            <select name="frequency" class="w-full px-2 py-1.5 border rounded-lg text-xs bg-white">
                                <option value="1">1 級 (極低)</option>
                                <option value="2">2 級 (偶發)</option>
                                <option value="3">3 級 (經常)</option>
                                <option value="4">4 級 (極高)</option>
                            </select>
                        </div>
                    </div>
                    <div class="space-y-2 pt-2 border-t">
                        <div class="text-xs font-bold text-slate-700">
                            五大控制措施填寫：
                            <span class="text-[11px] text-amber-600 font-semibold ml-1">(若無對應措施可直接不選，系統將自動帶入「無」)</span>
                        </div>
                        ${controlTypes.map(type => `
                            <div class="space-y-1" data-control-type="${type}">
                                <div class="flex justify-between items-center">
                                    <label class="text-[11px] font-semibold text-slate-600">${controlLabels[type]}</label>
                                    <button type="button" onclick="addControlRow('${blockId}', '${type}')" class="text-[10px] text-indigo-600 hover:underline">+ 方法</button>
                                </div>
                                <div class="sub-container-${type} space-y-1"></div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            container.prepend(div);
            controlTypes.forEach(type => addControlRow(blockId, type));
        }

        function toggleHazardInputMode(blockId) {
            const selectEl = document.getElementById(`hazard-select-${blockId}`);
            const inputEl = document.getElementById(`hazard-input-${blockId}`);
            const btnEl = document.getElementById(`btn-toggle-hazard-${blockId}`);

            if (inputEl.classList.contains('hidden')) {
                selectEl.classList.add('hidden');
                selectEl.value = '';
                inputEl.classList.remove('hidden');
                inputEl.focus();
                btnEl.textContent = "↩️ 選回歷史詞庫";
            } else {
                inputEl.classList.add('hidden');
                inputEl.value = '';
                selectEl.classList.remove('hidden');
                btnEl.textContent = "+ 沒有想要的？手動輸入";
            }
            updateControlDropdownsForBlock(blockId, '');
        }

        function toggleHazardBlock(blockId) {
            const block = document.getElementById(blockId);
            const isExpanded = block.getAttribute('data-expanded') === 'true';
            if (isExpanded) {
                collapseHazardBlock(block);
            } else {
                expandHazardBlock(block);
            }
        }

        function collapseHazardBlock(block) {
            block.setAttribute('data-expanded', 'false');
            block.querySelector('.block-content').classList.add('hidden');
            block.querySelector('.toggle-icon').className = "fa-solid fa-chevron-right mr-1 toggle-icon";
            
            const selectEl = block.querySelector(`#hazard-select-${block.id}`);
            const inputEl = block.querySelector(`#hazard-input-${block.id}`);
            let hName = '';
            if (inputEl && !inputEl.classList.contains('hidden')) {
                hName = inputEl.value.trim();
            } else if (selectEl) {
                hName = selectEl.value.trim();
            }

            const previewSpan = block.querySelector('.preview-title');
            previewSpan.textContent = hName ? `(已填寫: ${hName})` : '(尚未填寫危害名稱)';
            block.classList.add('bg-slate-100');
        }

        function expandHazardBlock(block) {
            block.setAttribute('data-expanded', 'true');
            block.querySelector('.block-content').classList.remove('hidden');
            block.querySelector('.toggle-icon').className = "fa-solid fa-chevron-down mr-1 toggle-icon";
            block.querySelector('.preview-title').textContent = '';
            block.classList.remove('bg-slate-100');
        }

        function onHazardSelectChange(blockId, selectedValue) {
            updateControlDropdownsForBlock(blockId, selectedValue);
        }

        function onHazardInputChange(blockId, typedValue) {
            updateControlDropdownsForBlock(blockId, typedValue.trim());
        }

        function updateControlDropdownsForBlock(blockId, hazardName) {
            const block = document.getElementById(blockId);
            controlTypes.forEach(type => {
                const subContainer = block.querySelector(`.sub-container-${type}`);
                if (!subContainer) return;

                let availableMethods = [];
                if (globalData.hazardControlHistory && 
                    globalData.hazardControlHistory[hazardName] && 
                    globalData.hazardControlHistory[hazardName][type]) {
                    availableMethods = globalData.hazardControlHistory[hazardName][type];
                }

                const controlOptionsHtml = `<option value="">-- 歷史詞庫 --</option>` +
                    availableMethods.map(c => `<option value="${c}">${c}</option>`).join('');

                const selects = subContainer.querySelectorAll('select.control-history-select');
                selects.forEach(sel => {
                    const currentVal = sel.value;
                    sel.innerHTML = controlOptionsHtml;
                    sel.value = currentVal;
                });
            });
        }

        function addControlRow(blockId, type, defaultValue = '') {
            const block = document.getElementById(blockId);
            const container = block.querySelector(`.sub-container-${type}`);
            
            const selectEl = document.getElementById(`hazard-select-${blockId}`);
            const inputEl = document.getElementById(`hazard-input-${blockId}`);
            let currentHazard = '';
            if (inputEl && !inputEl.classList.contains('hidden')) {
                currentHazard = inputEl.value.trim();
            } else if (selectEl) {
                currentHazard = selectEl.value.trim();
            }

            let availableMethods = [];
            if (globalData.hazardControlHistory && 
                globalData.hazardControlHistory[currentHazard] && 
                globalData.hazardControlHistory[currentHazard][type]) {
                availableMethods = globalData.hazardControlHistory[currentHazard][type];
            }

            const controlOptionsHtml = `<option value="">-- 歷史詞庫 --</option>` +
                availableMethods.map(c => `<option value="${c}">${c}</option>`).join('');

            const rowId = 'ctrl-row-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
            const div = document.createElement('div');
            div.className = "flex gap-1 items-center";
            div.id = rowId;
            div.innerHTML = `
                <select id="ctrl-select-${rowId}" class="control-history-select w-full px-2 py-1 border rounded text-[11px] bg-white">${controlOptionsHtml}</select>
                <input type="text" id="ctrl-input-${rowId}" value="${defaultValue}" placeholder="請輸入自訂控制方法..." class="hidden w-full px-2 py-1 border rounded text-[11px]">
                <button type="button" id="ctrl-btn-${rowId}" onclick="toggleControlInputMode('${rowId}')" class="text-[10px] text-indigo-600 hover:underline flex-shrink-0 px-1">＋手動輸入</button>
                <button type="button" onclick="document.getElementById('${rowId}').remove()" class="text-red-500 hover:text-red-700 px-1 text-xs"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(div);
        }

        function toggleControlInputMode(rowId) {
            const selectEl = document.getElementById(`ctrl-select-${rowId}`);
            const inputEl = document.getElementById(`ctrl-input-${rowId}`);
            const btnEl = document.getElementById(`ctrl-btn-${rowId}`);

            if (inputEl.classList.contains('hidden')) {
                selectEl.classList.add('hidden');
                selectEl.value = '';
                inputEl.classList.remove('hidden');
                inputEl.focus();
                btnEl.textContent = "↩️選歷史";
            } else {
                inputEl.classList.add('hidden');
                inputEl.value = '';
                selectEl.classList.remove('hidden');
                btnEl.textContent = "＋手動輸入";
            }
        }

        async function submitItemForm(event) {
            event.preventDefault();
            const itemName = document.getElementById('formItemName').value.trim();
            const hazardBlocks = document.querySelectorAll('.hazard-block');

            if (!itemName) {
                alert('請填寫儀器或動作名稱');
                return;
            }
            if (hazardBlocks.length === 0) {
                alert('請至少新增一個危害與控制措施區塊');
                return;
            }

            let hazardsList = [];
            for (let block of hazardBlocks) {
                const blockId = block.id;
                const selectEl = document.getElementById(`hazard-select-${blockId}`);
                const inputEl = document.getElementById(`hazard-input-${blockId}`);
                let hazardName = '';

                if (inputEl && !inputEl.classList.contains('hidden')) {
                    hazardName = inputEl.value.trim();
                } else if (selectEl) {
                    hazardName = selectEl.value.trim();
                }

                if (!hazardName) {
                    alert('尚有危害種類未選擇或填寫名稱！');
                    expandHazardBlock(block);
                    return;
                }

                const severity = block.querySelector('select[name="severity"]').value;
                const frequency = block.querySelector('select[name="frequency"]').value;

                let controlHierarchy = {};
                for (let type of controlTypes) {
                    const subContainer = block.querySelector(`.sub-container-${type}`);
                    const rows = subContainer.querySelectorAll('.flex');
                    let methods = [];

                    rows.forEach(row => {
                        const rowId = row.id;
                        const ctrlSelect = document.getElementById(`ctrl-select-${rowId}`);
                        const ctrlInput = document.getElementById(`ctrl-input-${rowId}`);
                        let val = '';

                        if (ctrlInput && !ctrlInput.classList.contains('hidden')) {
                            val = ctrlInput.value.trim();
                        } else if (ctrlSelect) {
                            val = ctrlSelect.value.trim();
                        }

                        if (val) methods.push(val);
                    });

                    controlHierarchy[type] = methods.length > 0 ? methods : ['無'];
                }

                hazardsList.push({
                    hazard: hazardName,
                    severity,
                    frequency,
                    controlHierarchy
                });
            }

            showLoading("正在送出自主提報...");
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'addItem',
                        itemName,
                        hazardsList,
                        isUserSubmit: true
                    })
                });
                const json = await res.json();
                hideLoading();
                if (json.status === 'success') {
                    alert('自主提報已成功送出，等待管理員審核！');
                    closeAddModal();
                    sessionStorage.removeItem('safety_culture_cache');
                } else {
                    alert(json.message || '送出失敗');
                }
            } catch (err) {
                hideLoading();
                alert('網路連線失敗，請稍後再試。');
            }
        }

        function openScanModal() {
            document.getElementById('scanModal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                decodedText => {
                    closeScanModal();
                    try {
                        const url = new URL(decodedText);
                        const itemParam = url.searchParams.get('item');
                        if (itemParam) {
                            router.goDetail(decodeURIComponent(itemParam));
                        } else {
                            alert("掃描到的 QR Code 不包含合法的設備參數。");
                        }
                    } catch (e) {
                        alert("掃描結果非有效網址格式：" + decodedText);
                    }
                },
                errorMessage => {}
            ).catch(err => {
                alert("無法啟動相機權限：" + err);
            });
        }

        function closeScanModal() {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanModal').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('scanModal').classList.add('hidden');
                });
            } else {
                document.getElementById('scanModal').classList.add('hidden');
            }
        }
    </script>
</body>
</html>
