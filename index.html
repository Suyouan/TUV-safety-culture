<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儀器與動作風險評估暨五大危害控制管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-lg font-bold flex items-center gap-2 cursor-pointer" onclick="router.goHome()">
                <i class="fa-solid fa-shield-halved"></i> 風險評估與控制管理
            </h1>
            <button onclick="router.goAdmin()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded text-sm font-medium transition">
                <i class="fa-solid fa-lock mr-1"></i> 管理後台
            </button>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 flex-grow">
        
        <!-- 視圖 1: 首頁列表 -->
        <div id="view-home" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3">
                <div class="flex gap-2">
                    <div class="relative flex-grow">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋儀器/動作名稱、危害或控制方法..." 
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button onclick="openScanModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2.5 rounded-lg font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-qrcode"></i> 掃描
                    </button>
                </div>
                <div class="flex justify-between items-center pt-2">
                    <button onclick="openAddModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-plus"></i> 新增儀器與危害控制評估
                    </button>
                    <button onclick="window.print()" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                        <i class="fa-solid fa-file-pdf"></i> 匯出標籤 PDF
                    </button>
                </div>
            </div>

            <div id="itemListContainer" class="space-y-3"></div>
        </div>

        <!-- 視圖 2: 詳細檢視 (完整呈現五大控制措施) -->
        <div id="view-detail" class="hidden space-y-4">
            <button onclick="router.goHome()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 text-sm">
                <i class="fa-solid fa-arrow-left"></i> 返回清單
            </button>
            <div id="detailContent" class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-6"></div>
        </div>

        <!-- 視圖 3: 管理員後台 -->
        <div id="view-admin" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <button onclick="router.goHome()" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-1 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> 返回前台
                </button>
                <h2 class="text-xl font-bold text-slate-800">管理員控制台</h2>
            </div>
            
            <div id="adminLoginCard" class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 max-w-md mx-auto space-y-4">
                <h3 class="font-bold text-lg text-center">請輸入管理員密碼</h3>
                <input type="password" id="adminPasswordInput" placeholder="預設密碼: 8888" class="w-full px-4 py-2 border rounded-lg">
                <button onclick="verifyAdmin()" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">登入後台</button>
            </div>

            <div id="adminPanel" class="hidden space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 space-y-4">
                    <h3 class="font-bold text-lg text-slate-700 border-b pb-2">待審核的自主提報項目</h3>
                    <div id="pendingListContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- 新增/提報 Modal (內含五大控制措施必要填寫區塊) -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold text-slate-800">新增風險評估與五大控制措施</h3>
                <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="addItemForm" onsubmit="submitItemForm(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">儀器 / 動作名稱 <span class="text-red-500">*</span></label>
                    <input type="text" id="formItemName" required class="w-full px-3 py-2 border rounded-lg" placeholder="例如：CNC 操作機台">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">危害種類 <span class="text-red-500">*</span></label>
                    <select id="selectHazardMaster" onchange="document.getElementById('formHazard').value = this.value" class="w-full px-3 py-2 border rounded-lg mb-2 text-sm bg-slate-50">
                        <option value="">-- 從歷史常用危害詞庫快速選擇 --</option>
                    </select>
                    <input type="text" id="formHazard" required class="w-full px-3 py-2 border rounded-lg" placeholder="或自行輸入危害種類描述">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">嚴重度 (1~4 級)</label>
                        <select id="formSeverity" class="w-full px-3 py-2 border rounded-lg">
                            <option value="1">1 級 (輕微)</option>
                            <option value="2">2 級 (中等)</option>
                            <option value="3">3 級 (嚴重)</option>
                            <option value="4">4 級 (極嚴重)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">發生頻率 (1~4 級)</label>
                        <select id="formFrequency" class="w-full px-3 py-2 border rounded-lg">
                            <option value="1">1 級 (極低)</option>
                            <option value="2">2 級 (偶發)</option>
                            <option value="3">3 級 (經常)</option>
                            <option value="4">4 級 (極高)</option>
                        </select>
                    </div>
                </div>

                <!-- 五大危害控制措施必要填寫區塊 -->
                <div class="border-t pt-4 space-y-3">
                    <h4 class="font-bold text-sm text-indigo-700"><i class="fa-solid fa-list-check mr-1"></i> 五大危害控制措施（必要填寫）</h4>
                    <p class="text-xs text-slate-500">請針對上述危害，於以下五大層級分別填入對應的具體控制方法（若無對應可填「無」）：</p>
                    
                    <div class="space-y-3 bg-slate-50 p-4 rounded-xl border">
                        <!-- 1. 消除 -->
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-slate-700">1. 消除 (Elimination)</label>
                                <button type="button" onclick="addControlRow('elimination')" class="text-xs text-indigo-600 hover:underline">+ 新增方法</button>
                            </div>
                            <div id="container-elimination" class="space-y-2"></div>
                        </div>
                        <!-- 2. 取代 -->
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-slate-700">2. 取代 (Substitution)</label>
                                <button type="button" onclick="addControlRow('substitution')" class="text-xs text-indigo-600 hover:underline">+ 新增方法</button>
                            </div>
                            <div id="container-substitution" class="space-y-2"></div>
                        </div>
                        <!-- 3. 工程控制 -->
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-slate-700">3. 工程控制 (Engineering Controls)</label>
                                <button type="button" onclick="addControlRow('engineering')" class="text-xs text-indigo-600 hover:underline">+ 新增方法</button>
                            </div>
                            <div id="container-engineering" class="space-y-2"></div>
                        </div>
                        <!-- 4. 管理控制 -->
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-slate-700">4. 管理控制 (Administrative Controls)</label>
                                <button type="button" onclick="addControlRow('administrative')" class="text-xs text-indigo-600 hover:underline">+ 新增方法</button>
                            </div>
                            <div id="container-administrative" class="space-y-2"></div>
                        </div>
                        <!-- 5. 個人防護具 -->
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-xs font-bold text-slate-700">5. 個人防護具 (PPE)</label>
                                <button type="button" onclick="addControlRow('ppe')" class="text-xs text-indigo-600 hover:underline">+ 新增方法</button>
                            </div>
                            <div id="container-ppe" class="space-y-2"></div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 border rounded-lg text-sm">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium">送出儲存</button>
                </div>
            </form>
        </div>
    </div>

    <!-- QR Code 掃描 Modal -->
    <div id="scanModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold">掃描設備/動作 QR Code</h3>
                <button onclick="closeScanModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="reader" class="w-full"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyP_Jv5s1OVin_8Q5bgl44InNAVNyyjNkzcYH9UdnTsZG6Zs0JMQZT7f5SeY2P1X3BF/exec";
        let globalData = { items: [], masterHazards: [], masterControls: [] };
        let html5QrCode = null;

        const controlTypes = ['elimination', 'substitution', 'engineering', 'administrative', 'ppe'];

        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
            checkUrlParams();
            // 初始化五大類別各給一個輸入行
            controlTypes.forEach(type => addControlRow(type, ''));
        });

        const router = {
            goHome() {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                fetchData();
            },
            goDetail(itemName) {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                renderDetailView(itemName);
            },
            goAdmin() {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
            }
        };

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const item = urlParams.get('item');
            if (item) {
                setTimeout(() => router.goDetail(decodeURIComponent(item)), 500);
            }
        }

        async function fetchData() {
            try {
                const res = await fetch(`${API_URL}?action=getData`);
                const json = await res.json();
                if (json.status === 'success') {
                    globalData = json;
                    renderItemList(globalData.items);
                    populateMasterSelectors();
                }
            } catch (err) {
                console.error("資料載入失敗", err);
            }
        }

        function handleSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = globalData.items.filter(item => {
                const matchName = item.itemName.toLowerCase().includes(keyword);
                const matchSub = item.hazards.some(h => {
                    if (h.hazard.toLowerCase().includes(keyword)) return true;
                    return Object.values(h.controlHierarchy).some(methods => 
                        methods.some(m => m.toLowerCase().includes(keyword))
                    );
                });
                return matchName || matchSub;
            });
            renderItemList(filtered);
        }

        function renderItemList(items) {
            const container = document.getElementById('itemListContainer');
            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-slate-400 bg-white rounded-xl border">找不到符合條件的項目</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center hover:shadow-md transition">
                    <div>
                        <h3 class="font-bold text-base text-slate-800">${item.itemName}</h3>
                        <p class="text-xs text-slate-500 mt-0.5">包含 ${item.hazards.length} 項危害種類評估（皆配置五大控制措施）</p>
                    </div>
                    <button onclick="router.goDetail('${item.itemName}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3 py-1.5 rounded-lg text-sm font-medium transition">
                        查看詳情 <i class="fa-solid fa-chevron-right ml-1 text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function renderDetailView(itemName) {
            const item = globalData.items.find(i => i.itemName === itemName);
            const container = document.getElementById('detailContent');
            if (!item) return;

            const currentUrl = `${window.location.origin}${window.location.pathname}?item=${encodeURIComponent(itemName)}`;

            const controlLabels = {
                elimination: '1. 消除 (Elimination)',
                substitution: '2. 取代 (Substitution)',
                engineering: '3. 工程控制 (Engineering Controls)',
                administrative: '4. 管理控制 (Administrative Controls)',
                ppe: '5. 個人防護具 (PPE)'
            };

            container.innerHTML = `
                <div class="flex justify-between items-start border-b pb-4">
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">${item.itemName}</h2>
                        <p class="text-xs text-slate-500 mt-1">完整風險評估與五大危害控制措施矩陣</p>
                    </div>
                    <div id="qrcode-box" class="p-2 bg-white border rounded-lg shadow-sm"></div>
                </div>
                <div class="space-y-6">
                    ${item.hazards.map((h, idx) => `
                        <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 space-y-3">
                            <div class="flex justify-between items-center border-b pb-2">
                                <span class="font-bold text-indigo-600 text-sm">#${idx + 1} 危害種類：${h.hazard}</span>
                                <span class="px-2 py-0.5 bg-amber-100 text-amber-800 rounded text-xs font-bold">風險等級: ${h.riskLevel} 級 (嚴重:${h.severity} / 頻率:${h.frequency})</span>
                            </div>
                            
                            <div class="space-y-2 pt-1">
                                <div class="text-xs font-bold text-slate-700">五大危害控制措施明細：</div>
                                ${Object.keys(controlLabels).map(key => {
                                    const methods = (h.controlHierarchy && h.controlHierarchy[key]) ? h.controlHierarchy[key] : ['無'];
                                    return `
                                        <div class="bg-white p-2.5 rounded border border-slate-100 text-xs">
                                            <span class="font-bold text-indigo-800 block mb-1">${controlLabels[key]}</span>
                                            <ul class="list-disc list-inside text-slate-600 space-y-0.5">
                                                ${methods.map(m => `<li>${m}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            new QRCode(document.getElementById("qrcode-box"), {
                text: currentUrl,
                width: 100,
                height: 100
            });
        }

        function populateMasterSelectors() {
            document.getElementById('selectHazardMaster').innerHTML = `<option value="">-- 從歷史常用危害詞庫快速選擇 --</option>` +
                globalData.masterHazards.map(h => `<option value="${h}">${h}</option>`).join('');
        }

        function addControlRow(type, val = '') {
            const container = document.getElementById(`container-${type}`);
            const row = document.createElement('div');
            row.className = "flex gap-2 items-center control-row-" + type;
            
            const controlOptions = `<option value="">-- 從歷史詞庫選擇 --</option>` +
                (globalData.masterControls ? globalData.masterControls.map(c => `<option value="${c}">${c}</option>`).join('') : '');
            
            row.innerHTML = `
                <select onchange="this.nextElementSibling.value = this.value" class="w-1/3 px-2 py-1 border rounded text-xs bg-white">${controlOptions}</select>
                <input type="text" value="${val}" required class="flex-grow px-3 py-1 border rounded text-xs" placeholder="請輸入控制方法">
                <button type="button" onclick="this.parentElement.remove()" class="text-red-500 hover:text-red-700 px-1 text-xs"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(row);
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { 
            document.getElementById('addModal').classList.add('hidden'); 
            document.getElementById('addItemForm').reset();
            controlTypes.forEach(type => {
                document.getElementById(`container-${type}`).innerHTML = '';
                addControlRow(type, '');
            });
        }

        async function submitItemForm(e) {
            e.preventDefault();
            
            // 收集五大控制措施各欄位資料
            const controlHierarchy = {};
            controlTypes.forEach(type => {
                const inputs = document.querySelectorAll(`#container-${type} input`);
                controlHierarchy[type] = Array.from(inputs).map(input => input.value).filter(Boolean);
                if (controlHierarchy[type].length === 0) controlHierarchy[type] = ['無'];
            });

            const payload = {
                action: 'addItem',
                itemName: document.getElementById('formItemName').value,
                hazard: document.getElementById('formHazard').value,
                severity: document.getElementById('formSeverity').value,
                frequency: document.getElementById('formFrequency').value,
                controlHierarchy: controlHierarchy,
                isUserSubmit: true
            };

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const json = await res.json();
            if (json.status === 'success') {
                alert('已成功送出！自主提報項目將進入待審核狀態。');
                closeAddModal();
                fetchData();
            }
        }

        function openScanModal() {
            document.getElementById('scanModal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                decodedText => { closeScanModal(); window.location.href = decodedText; },
                error => {}
            ).catch(err => console.error(err));
        }

        function closeScanModal() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => document.getElementById('scanModal').classList.add('hidden'));
            } else {
                document.getElementById('scanModal').classList.add('hidden');
            }
        }

        async function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            const res = await fetch(`${API_URL}?action=verifyAdmin&password=${encodeURIComponent(pass)}`);
            const json = await res.json();
            if (json.authorized) {
                document.getElementById('adminLoginCard').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadPendingItems();
            } else {
                alert('密碼錯誤！');
            }
        }

        function loadPendingItems() {
            const container = document.getElementById('pendingListContainer');
            const pendingItems = [];
            globalData.items.forEach(item => {
                item.hazards.forEach(h => {
                    if (h.status === 'Pending') pendingItems.push({ ...h, itemName: item.itemName });
                });
            });

            if (pendingItems.length === 0) {
                container.innerHTML = `<p class="text-sm text-slate-400">目前沒有待審核的項目。</p>`;
                return;
            }

            container.innerHTML = pendingItems.map(p => `
                <div class="p-4 border rounded-lg bg-slate-50 space-y-2">
                    <div class="font-bold text-sm text-indigo-600">${p.itemName}</div>
                    <div class="text-xs text-slate-600"><strong>危害：</strong>${p.hazard} (風險等級: ${p.riskLevel}級)</div>
                    <div class="flex justify-end gap-2 pt-1">
                        <button onclick="approveItem('${p.id}')" class="bg-emerald-600 text-white px-3 py-1 rounded text-xs font-medium">核准</button>
                    </div>
                </div>
            `).join('');
        }

    </script>
    <style>
        @media print {
            body * { visibility: hidden; }
            #itemListContainer, #itemListContainer * { visibility: visible; }
            #itemListContainer { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</body>
</html>
