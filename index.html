<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>風險評估與控制管理系統 - 極簡卡片流</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #print-labels-container, #print-labels-container * {
                visibility: visible;
            }
            #print-labels-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
                padding: 10px;
            }
            .no-print {
                display: none !important;
            }
            .label-card {
                border: 2px dashed #cbd5e1 !important;
                page-break-inside: avoid;
            }
            .print-detail-view, .print-detail-view * {
                visibility: visible !important;
            }
            .print-detail-view {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }
        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- 頂部極簡導覽 -->
    <header class="border-b border-zinc-800 bg-zinc-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <h1 class="text-sm font-semibold tracking-wider flex items-center gap-2 cursor-pointer text-zinc-200" onclick="router.goHome()">
                <i class="fa-solid fa-cube text-indigo-400"></i> RISK CONTROL
            </h1>
            <div class="flex items-center gap-2">
                <button onclick="openScanModal()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-full text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-qrcode"></i> 掃描
                </button>
                <button onclick="router.goAdmin()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3 py-1.5 rounded-full text-xs font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-lock"></i> 後台
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto p-4 flex-grow flex flex-col justify-center">
        
        <!-- 首頁：卡片流滑動檢視 -->
        <div id="view-home" class="space-y-4 my-auto">
            <!-- 搜尋與快速操作列 -->
            <div class="bg-zinc-800/50 p-3 rounded-2xl border border-zinc-800/80 flex gap-2 items-center">
                <div class="relative flex-grow">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-zinc-500 text-xs"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋設備、危害或控制對策..." 
                        class="w-full pl-9 pr-4 py-2 bg-zinc-900/90 border border-zinc-700/50 rounded-xl text-xs focus:outline-none focus:border-indigo-500 text-zinc-200 placeholder-zinc-500">
                </div>
                <button onclick="openAddModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-xl text-xs font-medium transition flex-shrink-0" title="自主提報風險評估">
                    <i class="fa-solid fa-plus"></i>
                </button>
                <button onclick="exportLabelsPdf()" class="bg-zinc-700 hover:bg-zinc-600 text-zinc-200 p-2.5 rounded-xl text-xs font-medium transition flex-shrink-0 no-print" title="批次匯出標籤卡">
                    <i class="fa-solid fa-file-pdf"></i>
                </button>
            </div>

            <!-- 卡片堆疊容器 (Card Stack Container) -->
            <div id="cardStackContainer" class="relative w-full min-h-[420px] flex items-center justify-center">
                <!-- 動態生成的卡片將在這裡顯示 -->
            </div>

            <!-- 卡片切換控制列 -->
            <div id="cardNavControls" class="flex justify-between items-center px-4 py-2">
                <button onclick="prevCard()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 w-10 h-10 rounded-full flex items-center justify-center transition border border-zinc-700/50">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </button>
                <span id="cardCounter" class="text-xs font-mono text-zinc-400">0 / 0</span>
                <button onclick="nextCard()" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 w-10 h-10 rounded-full flex items-center justify-center transition border border-zinc-700/50">
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </div>
        </div>

        <!-- 詳細檢視頁面 -->
        <div id="view-detail" class="hidden space-y-4 py-2">
            <button onclick="router.goHome()" class="text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1.5 text-xs no-print">
                <i class="fa-solid fa-arrow-left"></i> 返回卡片流
            </button>
            <div id="detailContent" class="bg-zinc-800/60 p-5 rounded-3xl border border-zinc-700/50 space-y-5 card-shadow"></div>
        </div>

        <!-- 管理員後台 -->
        <div id="view-admin" class="hidden space-y-4 py-2">
            <div class="flex justify-between items-center">
                <button onclick="router.goHome()" class="text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1.5 text-xs">
                    <i class="fa-solid fa-arrow-left"></i> 返回前台
                </button>
                <h2 class="text-sm font-bold text-zinc-200">管理員控制台</h2>
            </div>
            
            <div id="adminLoginCard" class="bg-zinc-800/60 p-6 rounded-3xl border border-zinc-700/50 max-w-sm mx-auto space-y-4 card-shadow mt-12">
                <h3 class="font-bold text-sm text-center text-zinc-200">請輸入管理員密碼</h3>
                <input type="password" id="adminPasswordInput" placeholder="預設密碼: 8888" class="w-full px-3 py-2 bg-zinc-900 border border-zinc-700 rounded-xl text-xs text-zinc-200">
                <button onclick="verifyAdmin()" class="w-full bg-indigo-600 text-white py-2 rounded-xl text-xs font-medium hover:bg-indigo-500 transition">登入後台</button>
            </div>

            <div id="adminPanel" class="hidden space-y-4">
                <div class="bg-zinc-800/60 p-5 rounded-3xl border border-zinc-700/50 space-y-3 card-shadow">
                    <h3 class="font-bold text-xs text-zinc-400 uppercase tracking-wider border-b border-zinc-700/50 pb-2">待審核的自主提報項目</h3>
                    <div id="pendingListContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>

    </main>

    <!-- 新增 Modal (支援動態多危害) -->
    <div id="addModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-lg w-full p-6 space-y-4 max-h-[85vh] overflow-y-auto card-shadow">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="text-sm font-bold text-zinc-100">自主提報風險評估</h3>
                <button onclick="closeAddModal()" class="text-zinc-500 hover:text-zinc-300"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form id="addItemForm" onsubmit="submitItemForm(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-400 mb-1">儀器 / 動作名稱 <span class="text-rose-500">*</span></label>
                    <input type="text" id="formItemName" required class="w-full px-3 py-2 bg-zinc-800 border border-zinc-700 rounded-xl text-xs text-zinc-200" placeholder="例如：CNC 操作機台">
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center border-b border-zinc-800 pb-1">
                        <h4 class="font-bold text-xs text-indigo-400">危害種類與控制對策</h4>
                        <button type="button" onclick="addHazardBlock()" class="bg-indigo-950 text-indigo-300 hover:bg-indigo-900 px-2 py-1 rounded-lg text-[10px] font-bold transition">
                            + 新增危害種類
                        </button>
                    </div>
                    <div id="hazardsContainer" class="space-y-3"></div>
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
                    <button type="button" onclick="closeAddModal()" class="px-3 py-2 bg-zinc-800 text-zinc-300 rounded-xl text-xs">取消</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-medium">送出提報</button>
                </div>
            </form>
        </div>
    </div>

    <!-- QR Code 掃描 Modal -->
    <div id="scanModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center z-50 p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl max-w-sm w-full p-5 space-y-4 card-shadow">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                <h3 class="text-sm font-bold text-zinc-200">掃描設備 QR Code</h3>
                <button onclick="closeScanModal()" class="text-zinc-500 hover:text-zinc-300"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div id="reader" class="w-full rounded-2xl overflow-hidden"></div>
        </div>
    </div>

    <!-- 標籤批次列印容器 -->
    <div id="print-labels-container" class="hidden"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyP_Jv5s1OVin_8Q5bgl44InNAVNyyjNkzcYH9UdnTsZG6Zs0JMQZT7f5SeY2P1X3BF/exec";
        let globalData = { items: [], masterHazards: [], masterControls: [] };
        let filteredItems = [];
        let currentCardIndex = 0;
        let html5QrCode = null;

        const controlTypes = ['elimination', 'substitution', 'engineering', 'administrative', 'ppe'];
        const controlLabels = {
            elimination: '1. 消除 (Elimination)',
            substitution: '2. 取代 (Substitution)',
            engineering: '3. 工程控制 (Engineering)',
            administrative: '4. 管理控制 (Administrative)',
            ppe: '5. 個人防護具 (PPE)'
        };

        window.addEventListener('DOMContentLoaded', () => {
            fetchData();
            checkUrlParams();
        });

        const router = {
            goHome() {
                document.getElementById('view-home').classList.remove('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                fetchData();
            },
            goDetail(itemName) {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                renderDetailView(itemName);
            },
            goAdmin() {
                document.getElementById('view-home').classList.add('hidden');
                document.getElementById('view-detail').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
            }
        };

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const itemName = urlParams.get('item');
            if (itemName) {
                const decodedName = decodeURIComponent(itemName);
                const checkInterval = setInterval(() => {
                    if (globalData.items && globalData.items.length > 0) {
                        clearInterval(checkInterval);
                        router.goDetail(decodedName);
                    }
                }, 100);
            }
        }

        async function fetchData() {
            try {
                const res = await fetch(`${API_URL}?action=getData`);
                const json = await res.json();
                if (json.status === 'success') {
                    globalData = json;
                    updateFilteredItems();
                }
            } catch (err) {
                console.error("資料載入失敗", err);
            }
        }

        function updateFilteredItems() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const approvedItems = globalData.items.map(item => {
                const validHazards = item.hazards.filter(h => h.status === 'Approved');
                return { ...item, hazards: validHazards };
            }).filter(item => item.hazards.length > 0);

            filteredItems = approvedItems.filter(item => {
                if (!keyword) return true;
                const matchName = item.itemName.toLowerCase().includes(keyword);
                const matchSub = item.hazards.some(h => {
                    if (h.hazard.toLowerCase().includes(keyword)) return true;
                    return Object.values(h.controlHierarchy).some(methods => 
                        methods.some(m => m.toLowerCase().includes(keyword))
                    );
                });
                return matchName || matchSub;
            });

            currentCardIndex = 0;
            renderCardStack();
        }

        function handleSearch() {
            updateFilteredItems();
        }

        // 動態卡片流渲染 (Card Stack Flow)
        function renderCardStack() {
            const container = document.getElementById('cardStackContainer');
            const counter = document.getElementById('cardCounter');
            const controls = document.getElementById('cardNavControls');

            if (filteredItems.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-zinc-500 text-xs">目前尚無符合條件的已核准設備項目</div>`;
                counter.textContent = `0 / 0`;
                controls.style.display = 'none';
                return;
            }

            controls.style.display = 'flex';
            counter.textContent = `${currentCardIndex + 1} / ${filteredItems.length}`;

            const item = filteredItems[currentCardIndex];
            const maxRisk = Math.max(...item.hazards.map(h => h.riskLevel || 1));
            
            // 風險等級樣式標籤
            let riskBadgeColor = 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
            if (maxRisk >= 4) riskBadgeColor = 'bg-rose-500/10 text-rose-400 border-rose-500/20';
            else if (maxRisk === 3) riskBadgeColor = 'bg-amber-500/10 text-amber-400 border-amber-500/20';
            else if (maxRisk === 2) riskBadgeColor = 'bg-yellow-500/10 text-yellow-400 border-yellow-500/20';

            container.innerHTML = `
                <div class="bg-zinc-800/80 border border-zinc-700/60 rounded-3xl p-6 w-full max-w-sm card-shadow space-y-6 transition-all duration-300 transform scale-100">
                    <div class="flex justify-between items-start">
                        <span class="px-3 py-1 rounded-full text-[10px] font-mono border ${riskBadgeColor}">最高風險: ${maxRisk} 級</span>
                        <span class="text-zinc-500 text-xs font-mono">#${currentCardIndex + 1}</span>
                    </div>

                    <div class="space-y-1">
                        <h3 class="text-lg font-bold text-zinc-100 tracking-tight">${item.itemName}</h3>
                        <p class="text-xs text-zinc-400">已核准危害種類：${item.hazards.length} 項</p>
                    </div>

                    <div class="space-y-2 bg-zinc-900/50 p-3.5 rounded-2xl border border-zinc-800">
                        <div class="text-[10px] font-bold text-zinc-500 uppercase tracking-wider">主要危害預覽</div>
                        <div class="space-y-1">
                            ${item.hazards.slice(0, 2).map(h => `<div class="text-xs text-zinc-300 truncate">• ${h.hazard} (風險 ${h.riskLevel}級)</div>`).join('')}
                            ${item.hazards.length > 2 ? `<div class="text-[10px] text-indigo-400">...還有 ${item.hazards.length - 2} 項危害</div>` : ''}
                        </div>
                    </div>

                    <button onclick="router.goDetail('${item.itemName}')" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-3 rounded-2xl text-xs font-medium transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                        <span>完整詳細報告與 QR Code</span>
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            `;
        }

        function nextCard() {
            if (filteredItems.length === 0) return;
            currentCardIndex = (currentCardIndex + 1) % filteredItems.length;
            renderCardStack();
        }

        function prevCard() {
            if (filteredItems.length === 0) return;
            currentCardIndex = (currentCardIndex - 1 + filteredItems.length) % filteredItems.length;
            renderCardStack();
        }

        // 詳細檢視頁面
        function renderDetailView(itemName) {
            const item = globalData.items.find(i => i.itemName === itemName);
            const container = document.getElementById('detailContent');
            
            if (!item) {
                container.innerHTML = `<div class="text-center py-8 text-zinc-500 text-xs">找不到該項目的詳細資料。</div>`;
                return;
            }

            const approvedHazards = item.hazards.filter(h => h.status === 'Approved');
            const isFullyApproved = approvedHazards.length > 0;
            const currentUrl = `${window.location.origin}${window.location.pathname}?item=${encodeURIComponent(itemName)}`;

            container.innerHTML = `
                <div class="flex justify-between items-start border-b border-zinc-700/50 pb-4">
                    <div>
                        <h2 class="text-base font-bold text-zinc-100">${item.itemName}</h2>
                        <p class="text-[11px] text-zinc-400 mt-0.5">完整風險評估與五大控制對策明細</p>
                    </div>
                    <div class="flex items-center gap-2 no-print">
                        ${isFullyApproved ? `<button onclick="window.print()" class="bg-zinc-700 hover:bg-zinc-600 text-zinc-200 px-3 py-2 rounded-xl text-xs font-medium flex items-center gap-1.5 transition"><i class="fa-solid fa-file-pdf"></i> 列印 / PDF</button>` : ''}
                    </div>
                </div>

                ${isFullyApproved ? `
                    <div class="flex justify-center my-2 no-print">
                        <div id="qrcode-box" class="p-3 bg-white rounded-2xl shadow-sm text-center">
                            <div class="text-[9px] text-zinc-800 font-bold mb-1">設備專屬 QR Code</div>
                        </div>
                    </div>
                ` : `<div class="no-print"><span class="px-2.5 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-full text-xs font-bold">尚未核准，無 QR Code</span></div>`}
                
                <div class="space-y-4 print-detail-view">
                    ${approvedHazards.map((h, idx) => `
                        <div class="bg-zinc-900/70 p-4 rounded-2xl border border-zinc-700/50 space-y-3">
                            <div class="flex justify-between items-center border-b border-zinc-800 pb-2">
                                <span class="font-bold text-indigo-400 text-xs">#${idx + 1} 危害：${h.hazard}</span>
                                <span class="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded text-[10px] font-bold">風險: ${h.riskLevel} 級 (嚴:${h.severity}/頻:${h.frequency})</span>
                            </div>
                            
                            <div class="space-y-2 pt-1">
                                <div class="text-[10px] font-bold text-zinc-400 uppercase tracking-wider">五大危害控制措施：</div>
                                ${controlTypes.map(type => {
                                    const methods = (h.controlHierarchy && h.controlHierarchy[type]) ? h.controlHierarchy[type] : ['無'];
                                    return `
                                        <div class="bg-zinc-800/80 p-2.5 rounded-xl border border-zinc-700/30 text-xs">
                                            <span class="font-bold text-indigo-300 block mb-1 text-[11px]">${controlLabels[type]}</span>
                                            <ul class="list-disc list-inside text-zinc-300 space-y-0.5 text-[11px]">
                                                ${methods.map(m => `<li>${m}</li>`).join('')}
                                            </ul>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            if (isFullyApproved) {
                const qrBox = document.getElementById("qrcode-box");
                if (qrBox) {
                    qrBox.innerHTML = '<div class="text-[9px] text-zinc-800 font-bold mb-1">設備專屬 QR Code</div>';
                    new QRCode(qrBox, {
                        text: currentUrl,
                        width: 90,
                        height: 90
                    });
                }
            }
        }

        // 動態新增危害種類區塊
        function addHazardBlock() {
            const container = document.getElementById('hazardsContainer');
            const blockId = 'hazard-block-' + Date.now();
            const hazardOptions = `<option value="">-- 歷史詞庫選擇 --</option>` +
                (globalData.masterHazards ? globalData.masterHazards.map(h => `<option value="${h}">${h}</option>`).join('') : '');

            const div = document.createElement('div');
            div.className = "p-4 bg-zinc-800/80 border border-zinc-700 rounded-2xl space-y-3 hazard-block";
            div.id = blockId;
            
            div.innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="text-[10px] font-bold text-indigo-400">危害區塊</span>
                    <button type="button" onclick="document.getElementById('${blockId}').remove()" class="text-rose-400 hover:text-rose-300 text-[10px]"><i class="fa-solid fa-trash mr-1"></i>移除</button>
                </div>
                <div>
                    <label class="block text-[10px] text-zinc-400 mb-1">危害種類 <span class="text-rose-500">*</span></label>
                    <select onchange="this.nextElementSibling.value = this.value" class="w-full px-2 py-1.5 bg-zinc-900 border border-zinc-700 rounded-xl mb-1 text-xs text-zinc-200">${hazardOptions}</select>
                    <input type="text" name="hazardName" required class="w-full px-3 py-1.5 bg-zinc-900 border border-zinc-700 rounded-xl text-xs text-zinc-200" placeholder="或自行輸入危害種類">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">嚴重度 (1~4)</label>
                        <select name="severity" class="w-full px-2 py-1.5 bg-zinc-900 border border-zinc-700 rounded-xl text-xs text-zinc-200">
                            <option value="1">1 級 (輕微)</option>
                            <option value="2">2 級 (中等)</option>
                            <option value="3">3 級 (嚴重)</option>
                            <option value="4">4 級 (極嚴重)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] text-zinc-400 mb-1">發生頻率 (1~4)</label>
                        <select name="frequency" class="w-full px-2 py-1.5 bg-zinc-900 border border-zinc-700 rounded-xl text-xs text-zinc-200">
                            <option value="1">1 級 (極低)</option>
                            <option value="2">2 級 (偶發)</option>
                            <option value="3">3 級 (經常)</option>
                            <option value="4">4 級 (極高)</option>
                        </select>
                    </div>
                </div>
                <div class="space-y-2 pt-2 border-t border-zinc-700">
                    <div class="text-[10px] font-bold text-zinc-400">五大控制措施填寫：</div>
                    ${controlTypes.map(type => `
                        <div class="space-y-1" data-control-type="${type}">
                            <div class="flex justify-between items-center">
                                <label class="text-[10px] font-medium text-zinc-400">${controlLabels[type]}</label>
                                <button type="button" onclick="addControlRow('${blockId}', '${type}')" class="text-[10px] text-indigo-400 hover:underline">+ 方法</button>
                            </div>
                            <div class="sub-container-${type} space-y-1"></div>
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
            controlTypes.forEach(type => addControlRow(blockId, type));
        }

        function addControlRow(blockId, type) {
            const block = document.getElementById(blockId);
            const container = block.querySelector(`.sub-container-${type}`);
            const controlOptions = `<option value="">-- 詞庫 --</option>` +
                (globalData.masterControls ? globalData.masterControls.map(c => `<option value="${c}">${c}</option>`).join('') : '');

            const row = document.createElement('div');
            row.className = "flex gap-1 items-center";
            row.innerHTML = `
                <select onchange="this.nextElementSibling.value = this.value" class="w-1/3 px-1 py-1 bg-zinc-900 border border-zinc-700 rounded-lg text-[10px] text-zinc-200">${controlOptions}</select>
                <input type="text" required class="flex-grow px-2 py-1 bg-zinc-900 border border-zinc-700 rounded-lg text-[10px] text-zinc-200" placeholder="控制對策描述">
                <button type="button" onclick="this.parentElement.remove()" class="text-zinc-500 hover:text-rose-400 px-1 text-xs"><i class="fa-solid fa-xmark"></i></button>
            `;
            container.appendChild(row);
        }

        function openAddModal() { 
            document.getElementById('addModal').classList.remove('hidden');
            document.getElementById('hazardsContainer').innerHTML = '';
            addHazardBlock();
        }

        function closeAddModal() { 
            document.getElementById('addModal').classList.add('hidden'); 
            document.getElementById('addItemForm').reset();
        }

        async function submitItemForm(e) {
            e.preventDefault();
            const itemName = document.getElementById('formItemName').value;
            const hazardBlocks = document.querySelectorAll('.hazard-block');
            
            if (hazardBlocks.length === 0) {
                alert('請至少新增一個危害種類！');
                return;
            }

            const hazardsList = [];
            hazardBlocks.forEach(block => {
                const hazard = block.querySelector('input[name="hazardName"]').value;
                const severity = block.querySelector('select[name="severity"]').value;
                const frequency = block.querySelector('select[name="frequency"]').value;
                
                const controlHierarchy = {};
                controlTypes.forEach(type => {
                    const inputs = block.querySelectorAll(`[data-control-type="${type}"] input`);
                    controlHierarchy[type] = Array.from(inputs).map(i => i.value).filter(Boolean);
                    if (controlHierarchy[type].length === 0) controlHierarchy[type] = ['無'];
                });

                hazardsList.push({ hazard, severity, frequency, controlHierarchy });
            });

            const payload = {
                action: 'addItem',
                itemName: itemName,
                hazardsList: hazardsList,
                isUserSubmit: true
            };

            const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
            const json = await res.json();
            if (json.status === 'success') {
                alert('已成功送出自主提報！等待管理員審核。');
                closeAddModal();
                fetchData();
            }
        }

        function openScanModal() {
            document.getElementById('scanModal').classList.remove('hidden');
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 220, height: 220 } },
                decodedText => { 
                    closeScanModal(); 
                    window.location.href = decodedText; 
                },
                error => {}
            ).catch(err => console.error(err));
        }

        function closeScanModal() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => document.getElementById('scanModal').classList.add('hidden'));
            } else {
                document.getElementById('scanModal').classList.add('hidden');
            }
        }

        async function verifyAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            const res = await fetch(`${API_URL}?action=verifyAdmin&password=${encodeURIComponent(pass)}`);
            const json = await res.json();
            if (json.authorized) {
                document.getElementById('adminLoginCard').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadPendingItems();
            } else {
                alert('密碼錯誤！');
            }
        }

        function loadPendingItems() {
            const container = document.getElementById('pendingListContainer');
            const pendingItems = [];
            globalData.items.forEach(item => {
                item.hazards.forEach(h => {
                    if (h.status === 'Pending') pendingItems.push({ ...h, itemName: item.itemName });
                });
            });

            if (pendingItems.length === 0) {
                container.innerHTML = `<p class="text-xs text-zinc-500">目前沒有待審核的項目。</p>`;
                return;
            }

            container.innerHTML = pendingItems.map(p => `
                <div class="p-4 bg-zinc-900 border border-zinc-800 rounded-2xl space-y-3">
                    <div class="flex justify-between items-start border-b border-zinc-800 pb-2">
                        <div>
                            <div class="font-bold text-xs text-indigo-400">${p.itemName}</div>
                            <div class="text-[11px] text-zinc-200 mt-0.5">危害：${p.hazard}</div>
                        </div>
                        <span class="px-2 py-0.5 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded text-[10px] font-bold">風險: ${p.riskLevel}級</span>
                    </div>

                    <div class="space-y-1">
                        <div class="text-[10px] font-bold text-zinc-400">五大控制措施細項：</div>
                        ${controlTypes.map(type => {
                            const methods = (p.controlHierarchy && p.controlHierarchy[type]) ? p.controlHierarchy[type] : ['無'];
                            return `
                                <div class="bg-zinc-800/50 p-2 rounded-xl border border-zinc-700/30 text-[11px]">
                                    <span class="font-bold text-indigo-300 block mb-0.5 text-[10px]">${controlLabels[type]}</span>
                                    <ul class="list-disc list-inside text-zinc-300 space-y-0.5">
                                        ${methods.map(m => `<li>${m}</li>`).join('')}
                                    </ul>
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <div class="flex justify-end gap-2 pt-2 border-t border-zinc-800">
                        <button onclick="updateStatus('${p.id}', 'Approved')" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-xl text-[11px] font-medium transition">核准</button>
                        <button onclick="updateStatus('${p.id}', 'Rejected')" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-xl text-[11px] font-medium transition">拒絕</button>
                    </div>
                </div>
            `).join('');
        }

        async function updateStatus(id, status) {
            globalData.items.forEach(item => {
                item.hazards.forEach(h => {
                    if (h.id === id) {
                        h.status = status;
                    }
                });
            });

            loadPendingItems();

            try {
                const res = await fetch(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'updateItemStatus', id, status }) 
                });
                const json = await res.json();
                if (json.status !== 'success') {
                    alert('後端狀態更新失敗');
                    fetchData();
                }
            } catch (err) {
                console.error("更新狀態發生錯誤", err);
            }
        }

        // 批次匯出標籤卡功能（支援智慧過濾與全量匯出、虛線裁切邊框）
        function exportLabelsPdf() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const approvedItems = globalData.items.map(item => {
                const validHazards = item.hazards.filter(h => h.status === 'Approved');
                return { ...item, hazards: validHazards };
            }).filter(item => item.hazards.length > 0);

            const targetItems = approvedItems.filter(item => {
                if (!keyword) return true;
                const matchName = item.itemName.toLowerCase().includes(keyword);
                const matchSub = item.hazards.some(h => {
                    if (h.hazard.toLowerCase().includes(keyword)) return true;
                    return Object.values(h.controlHierarchy).some(methods => 
                        methods.some(m => m.toLowerCase().includes(keyword))
                    );
                });
                return matchName || matchSub;
            });

            if (targetItems.length === 0) {
                alert('目前沒有符合條件的項目可供匯出標籤！');
                return;
            }

            const container = document.getElementById('print-labels-container');
            container.innerHTML = '';
            container.classList.remove('hidden');

            targetItems.forEach((item, index) => {
                const cardId = `label-qr-${index}`;
                const currentUrl = `${window.location.origin}${window.location.pathname}?item=${encodeURIComponent(item.itemName)}`;
                
                const cardDiv = document.createElement('div');
                cardDiv.className = "label-card bg-white p-4 rounded-xl border-2 border-dashed border-zinc-400 flex justify-between items-center w-full max-w-[380px] h-[150px] mx-auto shadow-sm";
                cardDiv.innerHTML = `
                    <div class="space-y-1 pr-2 overflow-hidden text-zinc-900">
                        <div class="text-[9px] text-indigo-600 font-bold uppercase tracking-wider">風險控制標籤卡</div>
                        <h4 class="font-bold text-sm text-zinc-900 truncate" style="max-width: 180px;" title="${item.itemName}">${item.itemName}</h4>
                        <p class="text-[10px] text-zinc-600">已核准危害：${item.hazards.length} 項</p>
                        <p class="text-[8px] text-zinc-400">請用手機掃描以檢視五大控制措施</p>
                    </div>
                    <div id="${cardId}" class="p-1 bg-white border rounded flex-shrink-0"></div>
                `;
                container.appendChild(cardDiv);

                new QRCode(document.getElementById(cardId), {
                    text: currentUrl,
                    width: 80,
                    height: 80
                });
            });

            setTimeout(() => {
                window.print();
                container.classList.add('hidden');
                container.innerHTML = '';
            }, 500);
        }
    </script>
</body>
</html>
