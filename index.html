<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">職安風險評估與控制平台 (多危害版)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <header class="bg-blue-600 text-white shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 id="main-title" class="text-xl font-bold">職安風險評估平台</h1>
      <button onclick="toggleAdminMode()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded text-sm transition">管理員模式</button>
      <span id="pending-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full hidden">0</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
    <div class="flex border-b border-gray-200">
      <button onclick="switchTab('create')" id="tab-create" class="py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none">新增風險評估提案</button>
      <button onclick="switchTab('search')" id="tab-search" class="py-2 px-4 font-medium text-gray-500 hover:text-gray-700 focus:outline-none">檢索與查詢</button>
    </div>

    <!-- 新增表單 -->
    <section id="section-create" class="bg-white p-6 rounded-lg shadow-sm space-y-4">
      <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">建立包含多個危害的評估提案</h2>
      
      <form id="assessment-form" onsubmit="submitAssessment(event)" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700">專屬評估名稱</label>
            <input type="text" id="assessment_name" required placeholder="例如：A廠區高壓電測試作業" class="mt-1 w-full p-2 border rounded">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700">建立者姓名</label>
            <input type="text" id="creator" required placeholder="您的姓名" class="mt-1 w-full p-2 border rounded">
          </div>
        </div>

        <!-- 動態危害項目容器 -->
        <div id="hazards-container" class="space-y-4">
          <!-- 預設第一項危害 -->
        </div>

        <button type="button" onclick="addHazardCard()" class="w-full border-2 border-dashed border-blue-300 text-blue-600 hover:bg-blue-50 py-2 rounded font-medium transition">
          ＋ 點此新增另一個危害項目
        </button>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded transition shadow">
          提交完整提案 (送出審批)
        </button>
      </form>
    </section>

    <!-- 檢索與查詢 -->
    <section id="section-search" class="bg-white p-6 rounded-lg shadow-sm space-y-4 hidden">
      <h2 class="text-lg font-semibold text-gray-700 border-b pb-2">跨欄位模糊搜尋</h2>
      <div class="flex gap-2">
        <input type="text" id="search-keyword" placeholder="輸入評估名稱或危害關鍵字..." class="flex-grow p-2 border rounded">
        <button onclick="performSearch()" class="bg-gray-800 text-white px-4 py-2 rounded">搜尋</button>
      </div>
      <div id="search-results" class="space-y-3 pt-2"></div>
    </section>
  </main>

  <!-- 管理員審批彈窗 -->
  <div id="admin-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-lg max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="text-lg font-bold text-red-600">管理員審批專區</h3>
        <button onclick="closeAdminModal()" class="text-gray-500 font-bold">✕ 關閉</button>
      </div>
      <div id="pending-container" class="space-y-4"></div>
    </div>
  </div>

  <script>
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyP_Jv5s1OVin_8Q5bgl44InNAVNyyjNkzcYH9UdnTsZG6Zs0JMQZT7f5SeY2P1X3BF/exec";
    const ADMIN_PASSWORD_HASH = "admin123";
    let globalSettings = {};

    window.onload = async function() {
  try {
    // 1. 抓取設定
    if (typeof fetchSettings === 'function') {
      await fetchSettings();
    }
    
    // 2. 初始化卡片
    if (typeof addHazardCard === 'function') {
      addHazardCard();
    }
    
    // 3. 檢查網址是否有帶 QR Code 的 assessment_id
    const urlParams = new URLSearchParams(window.location.search);
    const assessmentId = urlParams.get('assessment_id');
    
    if (assessmentId) {
      console.log("偵測到 QR Code ID:", assessmentId);
      if (typeof loadAssessmentDetail === 'function') {
        loadAssessmentDetail(assessmentId);
      }
    }
  } catch (err) {
    console.error("初始化載入發生錯誤：", err);
  }
};

    function switchTab(tabName) {
      if (tabName === 'create') {
        document.getElementById('section-create').classList.remove('hidden');
        document.getElementById('section-search').classList.add('hidden');
        document.getElementById('tab-create').className = "py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none";
        document.getElementById('tab-search').className = "py-2 px-4 font-medium text-gray-500 hover:text-gray-700 focus:outline-none";
      } else {
        document.getElementById('section-create').classList.add('hidden');
        document.getElementById('section-search').classList.remove('hidden');
        document.getElementById('tab-create').className = "py-2 px-4 font-medium text-gray-500 hover:text-gray-700 focus:outline-none";
        document.getElementById('tab-search').className = "py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-600 focus:outline-none";
        performSearch();
      }
    }

    async function fetchSettings() {
  try {
    let res = await fetch(`${GAS_API_URL}?action=getSettings`);
    let json = await res.json();
    if (json.status === "success") {
      window.globalSettings = json.data;
      
      // 如果畫面已經有卡片，抓到資料後自動幫現有選單灌入選項
      let settings = window.globalSettings;
      let hazardOpts = (settings.hazards || []).map(h => `<option value="${h}">${h}</option>`).join('');
      
      document.querySelectorAll('select[name="hazard_type"]').forEach(sel => {
        let currentVal = sel.value;
        sel.innerHTML = `<option value="">-- 請選擇現有危害種類 --</option>` + hazardOpts;
        sel.value = currentVal; // 保持原本選中的值
      });

      // 對五大控制措施做同樣的即時更新
      ['elimination', 'substitution', 'engineering', 'administrative', 'ppe'].forEach(cat => {
        let opts = (settings.controls?.[cat] || []).map(i => `<option value="${i}">${i}</option>`).join('');
        document.querySelectorAll(`select[name="control_${cat}"]`).forEach(sel => {
          let currentVal = sel.value;
          sel.innerHTML = `<option value="">-- 請選擇或點右上方自訂 --</option>` + opts;
          sel.value = currentVal;
        });
      });
    }
  } catch (err) { 
    console.error("取得設定失敗", err); 
  }
}

    function addHazardCard() {
  let container = document.getElementById('hazards-container');
  let cardId = 'hazard-card-' + Date.now();
  
  // 安全取得選項，避免 undefined 報錯
  let settings = window.globalSettings || { hazards: [], controls: { elimination: [], substitution: [], engineering: [], administrative: [], ppe: [] } };
  
  let hazardOpts = (settings.hazards || []).map(h => `<option value="${h}">${h}</option>`).join('');
  let elimOpts = (settings.controls?.elimination || []).map(i => `<option value="${i}">${i}</option>`).join('');
  let subOpts = (settings.controls?.substitution || []).map(i => `<option value="${i}">${i}</option>`).join('');
  let engOpts = (settings.controls?.engineering || []).map(i => `<option value="${i}">${i}</option>`).join('');
  let adminOpts = (settings.controls?.administrative || []).map(i => `<option value="${i}">${i}</option>`).join('');
  let ppeOpts = (settings.controls?.ppe || []).map(i => `<option value="${i}">${i}</option>`).join('');

  let cardHtml = `
    <div id="${cardId}" class="border border-blue-200 bg-blue-50/30 p-4 rounded-lg space-y-3 relative">
      <button type="button" onclick="this.parentElement.remove()" class="absolute top-3 right-3 text-red-500 hover:text-red-700 text-sm font-bold">移除此危害 ✕</button>
      <h3 class="font-bold text-blue-900 text-sm">危害項目</h3>
      
      <div>
        <div class="flex justify-between items-center">
          <label class="block text-xs font-semibold text-gray-600">危害種類</label>
          <button type="button" onclick="toggleInputType(this, 'hazard_type', '${cardId}')" class="text-[10px] text-blue-600 underline">✏️ 切換自訂輸入</button>
        </div>
        <div class="input-wrapper mt-1">
          <select name="hazard_type" class="w-full p-2 border rounded bg-white text-sm">
            <option value="">-- 請選擇現有危害種類 --</option>
            ${hazardOpts}
          </select>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-600">危害情境詳細描述</label>
        <textarea name="hazard_desc" rows="2" required placeholder="描述具體情境..." class="mt-1 w-full p-2 border rounded bg-white text-sm"></textarea>
      </div>

      <div class="grid grid-cols-3 gap-2 items-center bg-white p-3 rounded border">
        <div>
          <label class="block text-xs font-medium">嚴重性 (1~4)</label>
          <select name="severity" onchange="calculateCardRisk(this)" class="w-full p-1 border rounded text-sm">
            <option value="1">1 - 輕微</option><option value="2">2 - 中等</option><option value="3">3 - 嚴重</option><option value="4">4 - 災難</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium">頻率 (1~4)</label>
          <select name="likelihood" onchange="calculateCardRisk(this)" class="w-full p-1 border rounded text-sm">
            <option value="1">1 - 極罕見</option><option value="2">2 - 偶爾</option><option value="3">3 - 經常</option><option value="4">4 - 極頻繁</option>
          </select>
        </div>
        <div class="text-center">
          <span class="block text-[10px] text-gray-400">風險等級</span>
          <span class="risk-val text-lg font-black text-blue-600">1</span>
        </div>
      </div>

      <div class="space-y-2 pt-1">
        <p class="text-xs font-bold text-gray-700">五大控制措施</p>
        ${createControlField('消除 (Elimination)', 'control_elimination', elimOpts, cardId)}
        ${createControlField('替代 (Substitution)', 'control_substitution', subOpts, cardId)}
        ${createControlField('工程控制 (Engineering)', 'control_engineering', engOpts, cardId)}
        ${createControlField('管理控制 (Administrative)', 'control_administrative', adminOpts, cardId)}
        ${createControlField('個人防護具 (PPE)', 'control_ppe', ppeOpts, cardId)}
      </div>
    </div>
  `;
  container.insertAdjacentHTML('beforeend', cardHtml);
}

// 輔助函式：建立帶切換功能的控制措施欄位
function createControlField(labelName, fieldName, optionsHtml, cardId) {
  return `
    <div class="space-y-1">
      <div class="flex justify-between items-center">
        <span class="text-[11px] text-gray-600 font-medium">${labelName}</span>
        <button type="button" onclick="toggleInputType(this, '${fieldName}', '${cardId}')" class="text-[10px] text-blue-600 underline">✏️ 自訂</button>
      </div>
      <div class="input-wrapper">
        <select name="${fieldName}" class="w-full p-1.5 text-xs border rounded bg-white">
          <option value="">-- 請選擇或點右上方自訂 --</option>
          ${optionsHtml}
        </select>
      </div>
    </div>
  `;
}

// 切換 下拉選單 ⇄ 文字輸入框
function toggleInputType(btn, fieldName, cardId) {
  let wrapper = btn.closest('div.space-y-1, div:has(> .input-wrapper)').querySelector('.input-wrapper');
  let currentVal = wrapper.querySelector('input, select')?.value || '';
  
  if (wrapper.innerHTML.includes('select')) {
    // 轉成文字輸入框
    wrapper.innerHTML = `<input type="text" name="${fieldName}" value="${currentVal}" placeholder="請自行輸入..." class="w-full p-1.5 text-xs border rounded bg-white">`;
    btn.innerText = "📋 改回下拉選單";
  } else {
    // 轉回下拉選單
    let opts = '';
    if (fieldName === 'hazard_type') opts = (window.globalSettings?.hazards || []).map(h => `<option value="${h}">${h}</option>`).join('');
    else if (fieldName.includes('elimination')) opts = (window.globalSettings?.controls?.elimination || []).map(i => `<option value="${i}">${i}</option>`).join('');
    else if (fieldName.includes('substitution')) opts = (window.globalSettings?.controls?.substitution || []).map(i => `<option value="${i}">${i}</option>`).join('');
    else if (fieldName.includes('engineering')) opts = (window.globalSettings?.controls?.engineering || []).map(i => `<option value="${i}">${i}</option>`).join('');
    else if (fieldName.includes('administrative')) opts = (window.globalSettings?.controls?.administrative || []).map(i => `<option value="${i}">${i}</option>`).join('');
    else if (fieldName.includes('ppe')) opts = (window.globalSettings?.controls?.ppe || []).map(i => `<option value="${i}">${i}</option>`).join('');

    wrapper.innerHTML = `<select name="${fieldName}" class="w-full p-1.5 text-xs border rounded bg-white"><option value="">-- 請選擇 --</option>${opts}</select>`;
    btn.innerText = "✏️ 自訂";
  }
}

    // 計算單張卡片的風險等級 (嚴重性 × 頻率)
function calculateCardRisk(selectElement) {
  let card = selectElement.closest('.border'); // 找到當前這張危害卡片的外層容器
  let severity = parseInt(card.querySelector('select[name="severity"]').value) || 1;
  let likelihood = parseInt(card.querySelector('select[name="likelihood"]').value) || 1;
  let riskLevel = severity * likelihood;
  
  // 更新該卡片的風險等級顯示
  card.querySelector('.risk-val').innerText = riskLevel;
}

    async function submitAssessment(e) {
      e.preventDefault();
      let hazardCards = document.querySelectorAll('#hazards-container > div');
      if (hazardCards.length === 0) { alert("請至少新增一個危害項目！"); return; }

      let hazardsData = [];
      hazardCards.forEach(card => {
        hazardsData.push({
          hazard_type: card.querySelector('[name="hazard_type"]').value,
          hazard_desc: card.querySelector('[name="hazard_desc"]').value,
          severity: card.querySelector('[name="severity"]').value,
          likelihood: card.querySelector('[name="likelihood"]').value,
          control_elimination: card.querySelector('[name="control_elimination"]').value,
          control_substitution: card.querySelector('[name="control_substitution"]').value,
          control_engineering: card.querySelector('[name="control_engineering"]').value,
          control_administrative: card.querySelector('[name="control_administrative"]').value,
          control_ppe: card.querySelector('[name="control_ppe"]').value
        });
      });

      let payload = {
        action: "createAssessment",
        assessment_name: document.getElementById('assessment_name').value,
        creator: document.getElementById('creator').value,
        hazards: hazardsData
      };

      try {
        let res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(payload) });
        let json = await res.json();
        if (json.status === "success") {
          alert("提案已送出！等待管理員審批通過後即會生成 QR Code。");
          document.getElementById('assessment-form').reset();
          document.getElementById('hazards-container').innerHTML = '';
          addHazardCard();
          switchTab('search');
        } else { alert("送出失敗"); }
      } catch (err) { alert("網路異常"); }
    }

    async function performSearch() {
      let keyword = document.getElementById('search-keyword').value;
      try {
        let res = await fetch(`${GAS_API_URL}?action=search&keyword=${encodeURIComponent(keyword)}`);
        let json = await res.json();
        let container = document.getElementById('search-results');
        
        if (json.status === "success" && json.results.length > 0) {
          container.innerHTML = json.results.map(r => `
            <div onclick='showDetailModal(${JSON.stringify(r)})' class="border p-4 rounded-lg flex justify-between items-center bg-white shadow-sm hover:bg-blue-50 cursor-pointer transition">
              <div>
                <h4 class="font-bold text-blue-700">${r.assessment_name}</h4>
                <p class="text-xs text-gray-500">建立者: ${r.creator} | 狀態: <span class="${r.status === 'Approved' ? 'text-green-600' : 'text-orange-500'} font-semibold">${r.status}</span> | 包含危害數: ${r.hazards.length} 項</p>
              </div>
              <span class="text-xs bg-blue-100 text-blue-700 px-3 py-1.5 rounded font-medium">查看詳情</span>
            </div>
          `).join('');
        } else { container.innerHTML = `<p class="text-gray-500 text-center py-4">查無相關紀錄。</p>`; }
      } catch (err) { console.error(err); }
    }

    function showDetailModal(item) {
      let hazardsHtml = item.hazards.map((h, index) => `
        <div class="border p-3 rounded bg-gray-50 space-y-1 mb-2 text-xs">
          <div class="font-bold text-blue-900">#${index + 1} 危害種類: ${h.hazard_type} (風險等級: <span class="text-red-600 font-bold">${h.risk_level}</span>)</div>
          <div><strong>詳細描述：</strong>${h.hazard_desc}</div>
          <div class="pt-1 border-t space-y-0.5 text-gray-700">
            <div>• 消除：${h.control_elimination || '無'}</div>
            <div>• 替代：${h.control_substitution || '無'}</div>
            <div>• 工程：${h.control_engineering || '無'}</div>
            <div>• 管理：${h.control_administrative || '無'}</div>
            <div>• PPE：${h.control_ppe || '無'}</div>
          </div>
        </div>
      `).join('');

      let modalHtml = `
        <div id="detail-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
          <div class="bg-white rounded-lg max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto shadow-xl">
            <div class="flex justify-between items-center border-b pb-2">
              <h3 class="text-lg font-bold text-blue-800">${item.assessment_name}</h3>
              <button onclick="document.getElementById('detail-modal').remove()" class="text-gray-500 font-bold">✕ 關閉</button>
            </div>
            <div class="space-y-2">
              <h4 class="text-sm font-semibold text-gray-700">對應的所有危害與控制措施：</h4>
              ${hazardsHtml}
            </div>
            ${item.qr_code_url ? `<div class="text-center pt-2"><p class="text-xs text-gray-500 mb-1">專屬 QR Code</p><img src="${item.qr_code_url}" class="mx-auto w-28 h-28 border p-1 rounded"></div>` : `<p class="text-xs text-gray-400 text-center">尚未審批，無 QR Code。</p>`}
            <button onclick="document.getElementById('detail-modal').remove()" class="w-full bg-gray-800 text-white py-2 rounded text-sm">關閉視窗</button>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    async function toggleAdminMode() {
      let pwd = prompt("請輸入管理員密碼：");
      if (pwd === ADMIN_PASSWORD_HASH) loadPendingModal();
      else if (pwd !== null) alert("密碼錯誤！");
    }

    async function loadPendingModal() {
  try {
    let res = await fetch(`${GAS_API_URL}?action=getPending`);
    let json = await res.json();
    let container = document.getElementById('pending-container');
    
    if (json.status === "success" && json.pending.length > 0) {
      container.innerHTML = json.pending.map(item => {
        // 組合每一個危害項目的詳細內容
        let hazardsDetailHtml = (item.hazards || []).map((h, idx) => `
          <div class="bg-white p-3 rounded border border-gray-200 space-y-1 text-xs">
            <div class="font-bold text-blue-900">#${idx + 1} 危害種類：${h.hazard_type}</div>
            <div><span class="font-semibold text-gray-600">情境描述：</span>${h.hazard_desc}</div>
            <div class="grid grid-cols-3 gap-1 text-gray-700 bg-gray-50 p-1.5 rounded border my-1">
              <div>嚴重性: <span class="font-bold">${h.severity}</span></div>
              <div>頻率: <span class="font-bold">${h.likelihood}</span></div>
              <div>風險等級: <span class="font-bold text-red-600">${h.risk_level}</span></div>
            </div>
            <div class="space-y-0.5 pt-1 text-[11px] text-gray-600">
              <div><span class="font-semibold">1. 消除：</span>${h.control_elimination || '無'}</div>
              <div><span class="font-semibold">2. 替代：</span>${h.control_substitution || '無'}</div>
              <div><span class="font-semibold">3. 工程：</span>${h.control_engineering || '無'}</div>
              <div><span class="font-semibold">4. 管理：</span>${h.control_administrative || '無'}</div>
              <div><span class="font-semibold">5. 防護具：</span>${h.control_ppe || '無'}</div>
            </div>
          </div>
        `).join('');

        return `
          <div class="border p-4 rounded-lg bg-gray-50 space-y-3 shadow-sm">
            <div>
              <div class="font-bold text-base text-blue-900">${item.assessment_name}</div>
              <div class="text-xs text-gray-500">建立者: ${item.creator} (編號: ${item.assessment_id})</div>
            </div>
            
            <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
              <p class="text-xs font-bold text-gray-700">包含 ${item.hazards.length} 項危害明細：</p>
              ${hazardsDetailHtml}
            </div>

            <div class="flex gap-2 pt-2 border-t">
              <button onclick="approveAction('${item.assessment_id}', true)" class="bg-green-600 text-white px-3 py-1.5 text-xs font-bold rounded hover:bg-green-700">核准並產出 QR Code</button>
              <button onclick="approveAction('${item.assessment_id}', false)" class="bg-red-600 text-white px-3 py-1.5 text-xs font-bold rounded hover:bg-red-700">拒絕</button>
            </div>
          </div>
        `;
      }).join('');
    } else { 
      container.innerHTML = `<p class="text-gray-500 text-center py-4">目前無待審批項目。</p>`; 
    }
    
    document.getElementById('admin-modal').classList.remove('hidden');
  } catch (err) { 
    alert("載入失敗"); 
    console.error(err);
  }
}

    function closeAdminModal() { document.getElementById('admin-modal').classList.add('hidden'); }

    async function approveAction(id, isApproved) {
  let res = await fetch(GAS_API_URL, { 
    method: "POST", 
    body: JSON.stringify({ action: "approveAssessment", assessment_id: id, approve: isApproved }) 
  });
  let json = await res.json();
  
  if (json.status === "success") {
    alert(isApproved ? "已核准並自動生成 QR Code！" : "已拒絕。");
    
    // 1. 重新載入待審批彈窗清單
    loadPendingModal();
    
    // 2. 更新右上角的待審批紅點數量
    if (typeof checkPendingCount === 'function') {
      checkPendingCount();
    }
    
    // 3. 自動重新執行「檢索與查詢」的搜尋，讓背景的清單狀態即時變成 Approved 或 Rejected
    if (typeof performSearch === 'function') {
      performSearch();
    }
  }
}

    // 檢查待審批數量（安全防禦版，避免找不到 DOM 元素報錯）
    async function checkPendingCount() {
      try {
        let res = await fetch(`${GAS_API_URL}?action=getPending`);
        let json = await res.json();
        if (json.status === "success") {
          let count = json.pending ? json.pending.length : 0;
          let badge = document.getElementById('pending-badge');
          if (badge) {
            if (count > 0) {
              badge.innerText = count;
              badge.classList.remove('hidden');
            } else {
              badge.classList.add('hidden');
            }
          }
        }
      } catch (err) {
        console.error("檢查待審批數量失敗：", err);
      }
    }

    async function loadAssessmentDetail(id) {
      let res = await fetch(`${GAS_API_URL}?action=search&keyword=${encodeURIComponent(id)}`);
      let json = await res.json();
      if (json.status === "success" && json.results.length > 0) showDetailModal(json.results[0]);
    }
    
  </script>
</body>
